<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Set & Forget Desk</title>
<meta name="description" content="This week's trades as TradingView screenshots with entry, stop and target, plus notifications.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="S&F Desk">
<meta name="theme-color" content="#ffffff">
<style>
/* The screenshots are the app: one TradingView picture per trade, edge to edge, one caption line each.
   Everything else (notification log, device setup) sits behind the bell. */
:root{
  --bg:#ffffff; --surf:#F1F4FA; --ink:#0F1B33; --mute:#62708C; --line:#E1E6F0;
  --sell:#E5484D; --buy:#0E9F6E; --amber-ink:#8A5300; --amber-bg:#FFF2D0; --link:#2962FF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.35 var(--font);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) calc(env(safe-area-inset-bottom,0px) + 28px) env(safe-area-inset-left,0px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 10px 10px 16px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1}
.bell{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.bell svg{width:24px;height:24px}
.bell i{position:absolute;top:8px;right:9px;width:10px;height:10px;border-radius:50%;background:#F5A300;border:2px solid var(--bg);display:none}
.bell.new i{display:block}
.feed{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:26px 20px;max-width:1500px;margin:0 auto}
@media (min-width:700px){.feed{padding:0 20px}}
.cap{display:flex;align-items:center;gap:9px;padding:0 16px 8px}
@media (min-width:700px){.cap{padding-inline:2px}}
.pair{font-size:20px;font-weight:700;letter-spacing:-.01em}
.tag{font-size:12px;font-weight:700;border-radius:5px;padding:2px 8px}
.tag.sell{color:var(--sell);background:rgba(229,72,77,.12)} .tag.buy{color:var(--buy);background:rgba(14,159,110,.13)}
.st{margin-left:auto;font-size:13px;color:var(--mute);font-weight:500}
.st.at_zone{color:var(--amber-ink);background:var(--amber-bg);border-radius:999px;padding:2px 10px;font-weight:600}
.st.triggered{color:#fff;background:var(--buy);border-radius:999px;padding:2px 10px;font-weight:600}
.st.invalid{color:var(--sell);font-weight:600}
.shot{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;background:var(--surf);cursor:zoom-in;border-block:1px solid var(--line)}
@media (min-width:700px){.shot{border:1px solid var(--line);border-radius:10px}}
.none{padding:40px 24px;text-align:center;color:var(--mute)}
.view{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;display:flex}
.view[hidden]{display:none}
.view img{margin:auto;width:100%;max-width:min(100%,100dvh);height:auto;cursor:zoom-in}
.view.big img{width:230%;max-width:none;cursor:zoom-out}
.view button{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:31;background:var(--ink);color:#fff;font-weight:600;border-radius:999px;padding:8px 16px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(15,27,51,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:min(100%,560px);max-height:86dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:18px;max-height:80dvh}}
.phead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 10px}
.phead h2{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.phead button{font-weight:600;color:var(--link);padding:6px 4px}
.pbody{overflow-y:auto;padding:0 18px 18px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.dev{background:var(--surf);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:9px;font-size:14px}
.dev p{margin:0} .dev ol{margin:0;padding-left:20px} .dev b{font-weight:600}
.btn{align-self:flex-start;font-weight:600;color:#fff;background:var(--ink);border-radius:9px;padding:10px 16px}
.code{width:100%;height:64px;font:11.5px ui-monospace,Menlo,monospace;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;resize:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--buy);margin-right:7px}
.a{padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.a:first-child{border-top:0}
.a .h{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.a .h time{font-weight:400;font-size:12.5px;color:var(--mute);white-space:nowrap}
.a p{margin:3px 0 0;color:var(--mute)}
.quiet{color:var(--mute);font-size:14px;padding:6px 0}
.foot{font-size:12px;color:var(--mute);line-height:1.45}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
</style>
</head>
<body>
<header class="top">
  <h1 id="week">This week</h1>
  <button class="bell" id="bell" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><i></i></button>
</header>
<main class="feed" id="feed"><div class="none">Loading this week's charts</div></main>

<div class="view" id="view" hidden><button id="viewClose">Close</button><img id="viewImg" alt=""></div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-label="Notifications">
    <div class="phead"><h2>Notifications</h2><button id="close">Done</button></div>
    <div class="pbody">
      <div id="dev"></div>
      <div id="alerts"></div>
      <div class="foot">Entries on the charts are plans. They count only after the 1H shift of structure and a closed engulfing at the zone. Rule-based analysis of Alex G's Set &amp; Forget strategy, not financial advice. The trade decision is yours.</div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RAW = 'https://raw.githubusercontent.com/bhumiit9/trading-desk/main/';
const store = { get(k, d){ try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} } };
const STATUS = { waiting:'Waiting', at_zone:'At the zone', triggered:'Trigger seen', invalid:'Idea failed' };
const RANK = { triggered:0, at_zone:1, waiting:2, invalid:3 };
let feed = null;
const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString([], {weekday:'short', hour:'2-digit', minute:'2-digit'}); };
const safeChart = c => (typeof c === 'string' && /^charts\/[a-z0-9_-]+\.(png|jpg)$/.test(c)) ? c : null;
async function getJSON(url){ const r = await fetch(url + '?t=' + Date.now(), {cache:'no-store'}); if (!r.ok) throw new Error(r.status); return r.json(); }

function draw(){
  const trades = (feed.setups || []).filter(s => s.status !== 'no_trade' && safeChart(s.chart))
    .sort((a,b) => (RANK[a.status] ?? 2) - (RANK[b.status] ?? 2) || (a.order ?? 99) - (b.order ?? 99));
  $('#week').textContent = (feed.week && feed.week.label) || 'This week';
  $('#feed').innerHTML = trades.length ? trades.map(s => {
    const side = s.side === 'buy' ? 'buy' : 'sell', st = STATUS[s.status] ? s.status : 'waiting';
    const v = s.shot_at ? '?v=' + encodeURIComponent(s.shot_at) : '';
    return `<article><div class="cap"><span class="pair">${esc(s.pair)}</span><span class="tag ${side}">${side === 'buy' ? 'Buy' : 'Sell'}</span><span class="st ${st}">${STATUS[st]}</span></div>
      <img class="shot" src="${safeChart(s.chart)}${v}" alt="${esc(s.pair)} TradingView chart with entry, stop and target" loading="lazy" tabindex="0"></article>`; }).join('')
    : `<div class="none">No trades this week yet. The charts appear here after the weekly analysis.</div>`;
  const al = (feed.alerts || []).slice(0, 25);
  $('#alerts').innerHTML = al.length ? al.map(a => `<div class="a"><div class="h"><span>${esc(a.pair || 'Desk')}</span><time>${esc(when(a.at))}</time></div><p>${esc(a.text || '')}</p></div>`).join('') : '<div class="quiet">Nothing yet. A note appears here each time price reaches one of your zones.</div>';
  $('#bell').classList.toggle('new', (al[0] ? Date.parse(al[0].at) : 0) > Number(store.get('seen', 0)));
}
async function load(){
  if (document.hidden) return;
  const got = await Promise.allSettled([getJSON('data/feed.json'), getJSON(RAW + 'data/feed.json')]);
  const ok = got.filter(g => g.status === 'fulfilled' && g.value && g.value.updated).map(g => g.value).sort((a,b) => Date.parse(b.updated) - Date.parse(a.updated));
  if (ok.length){ if (!feed || Date.parse(ok[0].updated) > Date.parse(feed.updated)){ feed = ok[0]; draw(); } }
  else if (!feed) $('#feed').innerHTML = '<div class="none">The charts could not be loaded. Check the connection; the app retries by itself.</div>';
}
load(); setInterval(load, 5 * 60000); document.addEventListener('visibilitychange', load);

document.addEventListener('click', e => {
  const t = e.target;
  if (t.classList.contains('shot')){ $('#viewImg').src = t.src; $('#view').classList.remove('big'); $('#view').hidden = false; return; }
  if (t.id === 'viewImg'){ const v = $('#view'), big = v.classList.toggle('big'); if (big){ const r = t.getBoundingClientRect(); v.scrollLeft = (v.scrollWidth - v.clientWidth) * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); v.scrollTop = (v.scrollHeight - v.clientHeight) * Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)); } return; }
  if (t.id === 'viewClose'){ $('#view').hidden = true; return; }
  if (t.closest('#bell')){ $('#sheet').hidden = false; const a = feed?.alerts?.[0]; if (a) store.set('seen', Date.parse(a.at)); $('#bell').classList.remove('new'); return; }
  if (t.id === 'close' || t.id === 'sheet') $('#sheet').hidden = true;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ $('#sheet').hidden = true; $('#view').hidden = true; } if (e.key === 'Enter' && e.target.classList?.contains('shot')) e.target.click(); });

/* ---------- notifications on this device ---------- */
const b64uToBytes = s => { s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
const bytesToB64u = b => { let s = ''; for (const x of b) s += String.fromCharCode(x); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
async function fingerprint(endpoint){ const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(endpoint))); return [...h.slice(0,4)].map(x => x.toString(16).padStart(2,'0')).join(''); }
/* The device code is this device's push address, encrypted so that only the notification sender can read it. */
async function deviceCode(sub, encPub){
  const serverPub = await crypto.subtle.importKey('raw', b64uToBytes(encPub), {name:'ECDH', namedCurve:'P-256'}, false, []);
  const eph = await crypto.subtle.generateKey({name:'ECDH', namedCurve:'P-256'}, true, ['deriveBits']);
  const shared = await crypto.subtle.deriveBits({name:'ECDH', public:serverPub}, eph.privateKey, 256);
  const key = await crypto.subtle.importKey('raw', await crypto.subtle.digest('SHA-256', shared), 'AES-GCM', false, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(sub))));
  const ephPub = new Uint8Array(await crypto.subtle.exportKey('raw', eph.publicKey));
  const all = new Uint8Array(ephPub.length + iv.length + ct.length); all.set(ephPub,0); all.set(iv,ephPub.length); all.set(ct,ephPub.length+iv.length);
  return 'SFD1.' + await fingerprint(sub.endpoint) + '.' + bytesToB64u(all);
}
const push = { cfg:null, reg:null };
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const canPush = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function dev(html){ $('#dev').innerHTML = `<div class="dev">${html}</div>`; }
async function pushUI(msg){
  if (!canPush()){
    if (isIOS() && !standalone()) return dev(`<p><b>Install the app to get notifications on this iPhone.</b></p><ol><li>Tap the Share button in Safari.</li><li>Choose <b>Add to Home Screen</b>.</li><li>Open <b>S&amp;F Desk</b> from the Home Screen and tap the bell.</li></ol>`);
    return dev(`<p>This browser cannot show notifications. On a Mac use Safari or Chrome; on an iPhone use Safari and add the app to the Home Screen.</p>`);
  }
  if (Notification.permission === 'denied') return dev(`<p><b>Notifications are blocked for this app.</b> Allow them in this device's notification settings for S&amp;F Desk, then reopen the app.</p>`);
  let sub = null; try { sub = push.reg ? await push.reg.pushManager.getSubscription() : null; } catch (e) {}
  if (!sub) return dev(`<p>Get a notification on this device each time price reaches one of your zones.</p><button class="btn" id="pushOn">Turn on notifications</button>${msg ? `<p>${esc(msg)}</p>` : ''}`);
  let code = ''; try { code = await deviceCode(sub.toJSON(), push.cfg.encPublicKey); } catch (e) { return dev(`<p>Notifications are on, but the device code could not be made (${esc(e.message)}).</p>`); }
  const fp = code.split('.')[1];
  if ((push.cfg.devices || []).some(d => d && d.fp === fp)) return dev(`<p><span class="dot"></span><b>Notifications are on for this device.</b></p>`);
  dev(`<p><b>One last step:</b> copy this device code and send it to Claude in your chat.</p><textarea class="code" id="devCode" readonly>${esc(code)}</textarea><button class="btn" id="copyCode">Copy device code</button><p id="copyNote" style="color:var(--mute);font-size:12.5px">The code is encrypted. It only lets the Desk send notifications to this device.</p>`);
}
document.addEventListener('click', async e => {
  if (e.target.id === 'pushOn'){
    e.target.disabled = true;
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') return pushUI(perm === 'denied' ? '' : 'Notifications were not allowed. Tap the button to try again.');
      await push.reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64uToBytes(push.cfg.vapidPublicKey) });
      pushUI();
    } catch (err) { pushUI('Could not turn notifications on: ' + err.message); }
  }
  if (e.target.id === 'copyCode'){
    const ta = $('#devCode');
    try { await navigator.clipboard.writeText(ta.value); $('#copyNote').textContent = 'Copied. Paste it into your chat with Claude.'; }
    catch (err) { ta.focus(); ta.select(); $('#copyNote').textContent = 'Select the code above and copy it, then paste it into your chat with Claude.'; }
  }
});
(async () => {
  try { push.cfg = await getJSON('push/config.json'); } catch (e) { return; }
  if ('serviceWorker' in navigator){ try { push.reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready; } catch (e) {} }
  pushUI();
})();
</script>
</body>
</html>
