<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Set & Forget Desk</title>
<meta name="description" content="This week's trades: one TradingView chart per trade with entry, stop and target, plus notifications.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="S&F Desk">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* The app opens on a plain list of this week's pairs. Tapping a pair opens its chart with stop, entry and target;
   swipe sideways there for the next pair. The notification log and device setup sit behind the bell. */
:root{
  --bg:#000000; --surf:#14171C; --ink:#F3F5F9; --mute:#8E98AC; --line:#23272F;
  --sell:#FF5C61; --buy:#1FC98E; --amber-ink:#FFC65C; --amber-bg:#3A2A08; --link:#6C9BFF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.35 var(--font);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.app{position:relative;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
[hidden]{display:none !important}
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
.home,.detail{position:absolute;inset:0;transition:transform .38s cubic-bezier(.22,.8,.24,1),opacity .38s ease}
.home{overflow-y:auto;padding:10px 14px 14px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.home > .rows{flex:none;margin-bottom:14px}
.title{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:44px;margin:0;padding:0 56px 10px 6px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.rows{display:flex;flex-direction:column;gap:10px}
.detail{display:flex;flex-direction:column;background:var(--bg);transform:translateX(100%);visibility:hidden;transition:transform .38s cubic-bezier(.22,.8,.24,1),visibility 0s .38s;box-shadow:-1px 0 0 var(--line)}
.app.open .detail{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.22,.8,.24,1),visibility 0s}
.app.open .home{transform:translateX(-24%);opacity:.35}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes settle{from{opacity:0;transform:scale(1.035)}to{opacity:1;transform:none}}
@keyframes ring{0%,100%{transform:rotate(0)}12%{transform:rotate(16deg)}28%{transform:rotate(-13deg)}44%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}78%{transform:rotate(3deg)}}
@keyframes candle{from{height:10px}to{height:40px}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,163,0,.55)}100%{box-shadow:0 0 0 12px rgba(245,163,0,0)}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.loader{margin:auto;display:flex;gap:8px;align-items:center;height:48px}
.loader i{width:9px;border-radius:2px;background:var(--link);animation:candle .9s ease-in-out infinite alternate}
.loader i:nth-child(2){background:var(--sell);animation-delay:.18s} .loader i:nth-child(3){animation-delay:.36s}
.none.wait{display:flex;height:60%}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;height:78px;padding:0 16px 0 14px;border-radius:20px;background:var(--surf);font-size:24px;font-weight:700;letter-spacing:-.02em;
  animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 75ms + 90ms);transition:transform .15s,background .15s}
.row:active{transform:scale(.98);background:#1D2129}
.row .nm{flex:1;min-width:0}
/* the icon is the pair's own last 60 hours, drawn as a small chart */
.ico{flex:none;width:50px;height:50px;border-radius:15px;background:#000;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);color:#5E6878}
.ico.up{color:#6C9BFF} .ico.down{color:#FF5C61}
.ico svg{width:36px;height:36px;overflow:visible}
.ico .l{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:drawline 1s cubic-bezier(.3,.7,.2,1) .1s forwards}
.ico .f{opacity:0;animation:fadeTo .6s ease .7s forwards}
.ico circle{opacity:0;animation:fade .3s ease 1s forwards}
@keyframes drawline{to{stroke-dashoffset:0}}
@keyframes fadeTo{to{opacity:.2}}
.row .pct{font-size:17px;font-weight:700;color:var(--mute);letter-spacing:0;text-align:right}
.row .tk{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 6px;margin-right:-2px;border-radius:12px;font-size:12.5px;font-weight:700;letter-spacing:0;flex:none;color:#00140C;background:var(--buy);animation:pop .4s cubic-bezier(.2,.9,.3,1.2) both}
.pk{display:inline-flex;align-items:center;gap:4px;color:var(--amber-ink);font-size:13px;font-weight:700;letter-spacing:0;flex:none;animation:pop .4s cubic-bezier(.2,.9,.3,1.2) both}
.pk[hidden]{display:none}
.pickrow{display:flex;align-items:center;gap:12px;width:100%;flex:none;text-align:left;padding:12px 16px 12px 14px;margin-bottom:10px;border-radius:20px;background:var(--amber-bg);animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.pickrow[hidden]{display:none} .pickrow .pk svg{width:22px;height:22px}
.pickrow .pt{display:flex;flex-direction:column;min-width:0} .pickrow b{font-size:17px;font-weight:700;letter-spacing:-.01em} .pickrow small{font-size:13.5px;color:var(--amber-ink);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden} .pk svg{width:16px;height:16px} .row .pk svg{width:19px;height:19px}
.cap .pk{background:var(--amber-bg);border-radius:6px;padding:3px 8px 3px 6px}
.pickline{display:flex;gap:7px;margin:0 18px 10px;font-size:14px;line-height:1.35;color:var(--ink)} .pickline[hidden]{display:none}
.pickline svg{width:15px;height:15px;flex:none;margin-top:2px;color:var(--amber-ink)} .pickline span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .tk[hidden]{display:none} .row .tk svg{width:13px;height:13px}
@media (max-width:359px){ .row .tk b{display:none} .row .tk{padding:0 6px} }
.took{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 18px 10px;height:46px;flex:none;border-radius:14px;font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:var(--surf);border:0;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:background .25s,color .25s,transform .12s}
.took:active{transform:scale(.98)} .took svg{width:18px;height:18px}
.took .tick path{stroke-dasharray:1;stroke-dashoffset:1}
.took.on{background:var(--buy);color:#00140C;box-shadow:none} .took.on .tick path{stroke-dashoffset:0;transition:stroke-dashoffset .35s ease-out .05s}
.took:focus-visible{outline:2px solid var(--link);outline-offset:2px}

.row .live{width:10px;height:10px;border-radius:50%;background:#F5A300;animation:pulse 1.6s ease-out infinite}
.row > svg{width:20px;height:20px;color:#5E6878;flex:none;transition:transform .2s}
.row:active > svg{transform:translateX(5px)}
.slide.cur .shot{animation:settle .55s cubic-bezier(.2,.8,.2,1) both}
.slide.cur .lv{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:.16s}
.slide.cur .lv:nth-child(2){animation-delay:.24s} .slide.cur .lv:nth-child(3){animation-delay:.32s}
.slide.cur .state{animation:rise .5s cubic-bezier(.2,.8,.2,1) .4s both}
.bell svg{transform-origin:50% 12%} .bell.new svg{animation:ring 1.1s ease-in-out .9s 1}
.sheet{animation:fade .2s ease} .sheet .panel{animation:sheetUp .34s cubic-bezier(.2,.8,.2,1)}
.view{animation:fade .2s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
.back{width:44px;height:44px;margin-left:-12px;margin-right:-6px;display:grid;place-items:center}
.back svg{width:24px;height:24px}
.askbar{position:sticky;bottom:0;margin-top:auto;display:flex;align-items:center;gap:10px;width:100%;height:50px;flex:none;padding:0 16px;border-radius:25px;background:var(--surf);box-shadow:inset 0 0 0 1px var(--line),0 -14px 18px 6px var(--bg);color:var(--mute);font-size:16px;text-align:left;animation:rise .5s cubic-bezier(.2,.8,.2,1) .35s both}
.askbar svg{width:22px;height:22px;color:var(--link);flex:none} .askbar span{flex:1} .askbar:active{background:#1D2129}
.askbar:focus-visible,.askp:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.acts{display:flex;gap:8px;margin:0 18px 10px;flex:none}
.acts .took{margin:0;flex:1.35;min-width:0;white-space:nowrap}
.askp{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;height:46px;border-radius:14px;font-size:15px;font-weight:600;color:var(--ink);background:var(--surf);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap;transition:transform .12s}
.askp svg{width:19px;height:19px;color:var(--link)} .askp:active{transform:scale(.98)}
.slide.cur .acts{animation:rise .5s cubic-bezier(.2,.8,.2,1) .5s both}
.chat{position:fixed;left:0;right:0;top:0;height:var(--vvh,100dvh);z-index:25;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);animation:sheetUp .32s cubic-bezier(.2,.8,.2,1)}
.chat[hidden]{display:none}
.chat > *{width:min(100%,560px);margin-inline:auto}
.chead{display:flex;align-items:center;gap:10px;height:56px;flex:none;padding:0 12px 0 18px}
.chead h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;white-space:nowrap}
.chead .cctx{font-size:13px;font-weight:600;color:var(--mute);background:var(--surf);border-radius:999px;padding:3px 10px;white-space:nowrap}
.chead .cctx:empty{display:none}
.chead .grow{flex:1}
.chead button{font-weight:600;color:var(--link);padding:11px 6px;white-space:nowrap}
.chead .cctx{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px 14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:100%;font-size:16px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
.msg.me{align-self:flex-end;max-width:86%;background:var(--surf);border-radius:18px 18px 4px 18px;padding:9px 14px}
.msg.err{color:var(--sell);font-size:14.5px}
.msg.wait{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14.5px}
.msg .loader{height:26px;margin:0;gap:5px} .msg .loader i{width:6px;animation-name:candleS}
@keyframes candleS{from{height:6px}to{height:22px}}
.cstart{margin:auto 0 0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.cstart p{margin:0 0 4px;color:var(--mute);font-size:15px}
.sug{text-align:left;font-size:15px;font-weight:600;color:var(--ink);background:var(--surf);border-radius:14px;padding:11px 14px;animation:rise .4s cubic-bezier(.2,.8,.2,1) calc(var(--i)*.06s) both}
.sug:active{background:#1D2129}
.linkbtn{font-size:13px;color:var(--mute);text-decoration:underline;padding:10px 0}
.ckey{margin:auto 0;display:flex;flex-direction:column;gap:12px}
.ckey h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.ckey p{margin:0;color:var(--mute);font-size:15px;line-height:1.45}
.ckey input{font:inherit;font-size:16px;color:var(--ink);background:var(--surf);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:13px 14px;width:100%}
.ckey input:focus-visible,.cform textarea:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.ckey .note{font-size:13.5px;color:var(--sell);min-height:1.2em}
.cform{display:flex;align-items:flex-end;gap:8px;flex:none;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.cform[hidden]{display:none}
.cform textarea{flex:1;font:inherit;font-size:16px;line-height:1.35;color:var(--ink);background:var(--surf);border:0;border-radius:20px;padding:11px 16px;resize:none;max-height:132px;min-height:44px}
.cform textarea::placeholder,.ckey input::placeholder{color:#6B7486}
.cform button{flex:none;width:44px;height:44px;border-radius:50%;background:var(--link);color:#000;display:grid;place-items:center;transition:opacity .2s,transform .12s}
.cform button:disabled{opacity:.35} .cform button:active{transform:scale(.94)} .cform button svg{width:20px;height:20px}
.cnote{flex:none;font-size:11.5px;color:#6B7486;text-align:center;padding:0 18px 4px}
.bell{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 6px);right:calc(env(safe-area-inset-right,0px) + 8px);width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.bell svg{width:25px;height:25px}
.bell i{position:absolute;top:8px;right:9px;width:10px;height:10px;border-radius:50%;background:#F5A300;border:2px solid var(--bg);display:none}
.bell.new i{display:block}
.deck{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.deck::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}
.cap{display:flex;align-items:center;gap:10px;height:56px;flex:none;padding:0 60px 0 18px;position:sticky;top:0;z-index:2;background:var(--bg)}
.pair{font-size:26px;font-weight:700;letter-spacing:-.02em}
.tag{font-size:13px;font-weight:700;border-radius:6px;padding:3px 9px}
.tag.sell{color:var(--sell);background:rgba(255,92,97,.16)} .tag.buy{color:var(--buy);background:rgba(31,201,142,.16)}
.tfs{position:relative;display:grid;grid-template-columns:repeat(4,1fr);flex:none;margin:0 10px 8px;padding:3px;border-radius:13px;background:var(--surf)}
.tfs::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/4);border-radius:10px;background:#2B3140;transform:translateX(calc(var(--k,2)*100%));transition:transform .32s cubic-bezier(.3,.8,.3,1)}
.tfs button{position:relative;height:34px;border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--mute);cursor:pointer;border-radius:10px;white-space:nowrap;transition:color .2s}
.tfs button[aria-selected="true"]{color:var(--ink)}
.tfs button small{font-size:12px;font-weight:600;color:var(--buy);margin-left:3px}
.tfs button:focus-visible{outline:2px solid var(--link);outline-offset:-2px}
.shot.swap{animation:settle .4s cubic-bezier(.2,.8,.2,1) both}
.chips li[hidden]{display:none}
.slide.quick .chips li{animation-delay:calc(var(--i)*.05s)}
@media (max-width:380px){ .tfs button{font-size:13px} .tfs button small{font-size:11px;margin-left:2px} }
.pic{flex:1 0 300px;min-height:300px;display:flex;margin:0 10px;border-radius:14px;overflow:hidden;background:#fff}
.shot{width:100%;height:100%;object-fit:contain;object-position:center top;cursor:zoom-in;display:block}
.levels{display:grid;grid-template-columns:1fr 1fr auto;padding:12px 18px 4px;gap:8px}
.lv span{display:block;font-size:13px;color:var(--mute)}
.lv b{display:block;font-size:clamp(17px,5.4vw,22px);font-weight:700;letter-spacing:-.01em;line-height:1.2;white-space:nowrap}
.lv.stop b{color:var(--sell)} .lv.target b{color:var(--buy)}
.lv small{font-size:12.5px;font-weight:600;color:var(--buy);margin-left:4px}
.state{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 18px 10px;font-size:14px;color:var(--mute)}
.state span{white-space:nowrap}
.st{font-weight:600;color:var(--ink);background:var(--surf);border-radius:999px;padding:3px 11px}
.st.at_zone{color:var(--amber-ink);background:var(--amber-bg)} .st.triggered{color:#00140C;background:var(--buy)} .st.invalid{color:var(--sell)}
.state .when{margin-left:auto;font-size:12.5px;white-space:nowrap}
.conf{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:10px;padding:2px 18px 10px;font-size:14px;color:var(--mute)}
.conf b{font-size:17px;color:var(--ink);font-weight:700}
.meter{position:relative;height:8px;border-radius:4px;background:var(--surf)}
.meter u{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--link);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1) .35s}
.slide.cur .meter u{width:var(--w)}
.meter em{position:absolute;top:-4px;bottom:-4px;left:70%;width:2px;border-radius:1px;background:#4A5261}
.slide.cur .conf{animation:rise .5s cubic-bezier(.2,.8,.2,1) .46s both}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 10px;margin:0;list-style:none}
.chips li{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:14px;font-size:13px;font-weight:600;white-space:nowrap}
.chips li svg{width:14px;height:14px;flex:none}
.chips .ok{background:rgba(31,201,142,.15);color:var(--ink)} .chips .ok svg{color:var(--buy)} .chips .ok small{font-size:12px;font-weight:600;color:var(--buy)}
.chips .no{box-shadow:inset 0 0 0 1px var(--line);color:var(--mute);font-weight:500}
.slide.cur .chips li{animation:pop .42s cubic-bezier(.2,.9,.3,1.2) calc(.55s + var(--i)*.06s) both}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(6px)}to{opacity:1;transform:none}}
.dots{display:flex;justify-content:center;gap:7px;padding:2px 0 12px}
.dots i{width:7px;height:7px;border-radius:50%;background:#353B46} .dots i.on{background:var(--ink)}
.none{margin:auto;padding:40px 28px;text-align:center;color:var(--mute)}
@media (min-width:800px){ body{background:#0B0D10} .app{max-width:520px;margin:0 auto;background:var(--bg);box-shadow:0 0 0 1px var(--line)} }
.view{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;display:flex}
.view[hidden]{display:none}
.view img{margin:auto;width:100%;max-width:min(100%,80dvh);height:auto;cursor:zoom-in}
.view.big img{width:230%;max-width:none;cursor:zoom-out}
.view button{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:31;background:var(--ink);color:#000;font-weight:600;border-radius:999px;padding:11px 18px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:#101216;box-shadow:0 0 0 1px var(--line);width:min(100%,560px);max-height:86dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:800px){.sheet{align-items:center}.panel{border-radius:18px;max-height:80dvh}}
.phead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 8px}
.phead h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.phead button{font-weight:600;color:var(--link);padding:11px 6px}
.pbody{overflow-y:auto;padding:0 18px 18px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.dev{background:var(--surf);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:9px;font-size:14.5px}
.dev p{margin:0} .dev ol{margin:0;padding-left:20px} .dev b{font-weight:600}
.btn{align-self:flex-start;font-weight:600;color:#000;background:var(--ink);border-radius:10px;padding:12px 18px}
.code{width:100%;height:64px;font:11.5px ui-monospace,Menlo,monospace;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;resize:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--buy);margin-right:7px}
.a{display:block;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.a:first-child{border-top:0}
.a .h{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.a .h time{font-weight:400;font-size:13px;color:var(--mute);white-space:nowrap}
.a p{margin:2px 0 0;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a.open p{display:block}
.quiet{color:var(--mute);font-size:14.5px;padding:6px 0}
.foot{font-size:12.5px;color:var(--mute);line-height:1.45}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
</style>
</head>
<body>
<div class="app" id="app">
  <button class="bell" id="bell" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><i></i></button>
  <div class="stage">
    <main class="home" id="home"><h1 class="title" id="week">This week</h1><button class="pickrow" id="pickrow" hidden><span class="pk" id="pickstar"></span><span class="pt"><b></b><small></small></span></button><div class="rows" id="rows"><div class="none wait" role="status" aria-label="Loading this week's pairs"><div class="loader"><i></i><i></i><i></i></div></div></div><button class="askbar" id="askHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 1 3.4 6.5L4 19.5l1-3.3A8 8 0 0 1 4 12z"/><path d="M9 11h6M9 14h4"/></svg><span>Ask about your watchlist</span></button></main>
    <section class="detail" id="detail" aria-hidden="true">
      <div class="deck" id="deck"></div>
      <nav class="dots" id="dots" aria-hidden="true"></nav>
    </section>
  </div>
</div>

<div class="view" id="view" hidden><button id="viewClose">Close</button><img id="viewImg" alt=""></div>

<div class="chat" id="chat" role="dialog" aria-label="Ask Claude" hidden>
  <header class="chead"><h2>Ask Claude</h2><span class="cctx" id="cctx"></span><span class="grow"></span><button id="chatNew">New</button><button id="chatClose">Done</button></header>
  <div class="cbody" id="cbody" aria-live="polite"></div>
  <form class="cform" id="cform"><textarea id="cin" rows="1" placeholder="Ask about this week's trades" aria-label="Your message" enterkeyhint="send"></textarea><button id="csend" aria-label="Send" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></button></form>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-label="Notifications">
    <div class="phead"><h2>Notifications</h2><span><button id="refresh">Refresh</button>&ensp;<button id="close">Done</button></span></div>
    <div class="pbody">
      <div id="dev"></div>
      <div id="alerts"></div>
      <div class="foot">Entries on the charts are plans. They count only after the 1H shift of structure and a closed entry candle at the zone. Rule-based analysis, not financial advice. The trade decision is yours.</div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RAW = 'https://raw.githubusercontent.com/bhumiit9/trading-desk/main/';
const store = { get(k, d){ try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} } };
const STATUS = { waiting:'Waiting', at_zone:'At the zone', triggered:'Trigger seen', invalid:'Idea failed' };
const RANK = { triggered:0, at_zone:1, waiting:2, invalid:3 };
const BUILD = '2026-11-11.16';
let feed = null, shown = '', shownHome = '', view = null;
const isJPY = p => /JPY/.test(p);
const px = (p, v) => typeof v === 'number' ? v.toFixed(isJPY(p) ? 3 : 4) : '–';
const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString([], {weekday:'short', hour:'numeric', minute:'2-digit'}); };
const safeChart = c => (typeof c === 'string' && /^charts\/[a-z0-9_-]+\.(png|jpg)$/.test(c)) ? c : null;
async function getJSON(url){ const r = await fetch(url + '?t=' + Date.now(), {cache:'no-store'}); if (!r.ok) throw new Error(r.status); return r.json(); }

const TICK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const STAR = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6l1.9 4 4.4.5-3.3 3 .9 4.3L8 11.2l-3.9 2.2.9-4.3-3.3-3 4.4-.5z" fill="currentColor"/></svg>';
const RING = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.6 2.6"/></svg>';
/* Trades the owner marked as taken. Kept on this device only, never sent anywhere. */
let takenMem = null;
function takenAll(){ if (!takenMem){ try { takenMem = JSON.parse(store.get('taken', '{}')) || {}; } catch (e) { takenMem = {}; } } return takenMem; }
const takenKey = pair => ((feed && feed.week && feed.week.label) || '') + '|' + pair;
function markTaken(){
  const all = takenAll();
  document.querySelectorAll('.took').forEach(b => { const at = all[takenKey(b.dataset.took)]; b.classList.toggle('on', !!at); b.setAttribute('aria-pressed', at ? 'true' : 'false');
    b.querySelector('span').textContent = at ? 'Taken ' + new Date(at).toLocaleDateString([], {day:'numeric', month:'short'}) : 'Mark as taken'; });
  document.querySelectorAll('.row[data-open]').forEach(r => { const k = r.querySelector('.tk'); if (k) k.hidden = !all[takenKey(r.dataset.open)]; });
}
function toggleTaken(pair){ const all = takenAll(), k = takenKey(pair); if (all[k]) delete all[k]; else all[k] = Date.now(); store.set('taken', JSON.stringify(all)); markTaken(); }
const TFS = ['W','D','4H','1H'], TFNAME = { W:'Weekly', D:'Daily', '4H':'4H', '1H':'1H' };
const tfSel = {};
function confOf(s){ return Array.isArray(s.conf) ? s.conf.filter(c => c && TFS.includes(c.tf)) : []; }
function chartsOf(s){ const out = {}; (Array.isArray(s.charts) ? s.charts : []).forEach(c => { const src = c && safeChart(c.src); if (src && TFS.includes(c.tf)) out[c.tf] = [src, c.at || '']; });
  if (!Object.keys(out).length && safeChart(s.chart)) out['4H'] = [safeChart(s.chart), s.shot_at || '']; return out; }
function chips(s) {
  const all = confOf(s); if (!all.length) return '';
  let i = 0;
  return `<ul class="chips" aria-label="Confluences on this timeframe">${all.map(c => c.ok
    ? `<li class="ok" data-tf="${esc(c.tf)}" style="--i:${i++}">${TICK}<span class="sr">Have: </span>${esc(c.name)} <small>+${Number(c.pts) || 0}</small></li>`
    : `<li class="no" data-tf="${esc(c.tf)}" style="--i:${i++}">${RING}<span class="sr">Still needed: </span>${esc(c.name)}</li>`).join('')}</ul>`;
}
function tabs(s){
  const ch = chartsOf(s), have = TFS.filter(t => ch[t]); if (have.length < 2) return '';
  const pts = t => confOf(s).filter(c => c.tf === t && c.ok).reduce((a, c) => a + (Number(c.pts) || 0), 0);
  return `<div class="tfs" role="tablist" aria-label="Timeframe">${TFS.map(t => `<button role="tab" data-tf="${t}" aria-selected="false"${ch[t] ? '' : ' disabled'}>${TFNAME[t]}${pts(t) ? `<small>+${pts(t)}</small>` : ''}</button>`).join('')}</div>`;
}
/* Show one timeframe in a trade: its chart and its confluences. */
function setTF(el, tf, animate){
  let ch = {}; try { ch = JSON.parse(el.dataset.charts || '{}'); } catch (e) {}
  if (!ch[tf]) tf = ch['4H'] ? '4H' : Object.keys(ch)[0]; if (!tf) return;
  tfSel[el.dataset.pair] = tf; el.dataset.tf = tf;
  const bar = el.querySelector('.tfs'); if (bar){ bar.style.setProperty('--k', TFS.indexOf(tf)); bar.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.tf === tf ? 'true' : 'false')); }
  const img = el.querySelector('.shot'), src = ch[tf][0] + (ch[tf][1] ? '?v=' + encodeURIComponent(ch[tf][1]) : '');
  if (img && img.getAttribute('src') !== src){ img.classList.remove('swap'); img.src = src; img.alt = `${el.dataset.pair} ${TFNAME[tf]} TradingView chart`; if (animate){ void img.offsetWidth; img.classList.add('swap'); } }
  let n = 0; if (animate) el.classList.add('quick');
  el.querySelectorAll('.chips li').forEach(li => { li.hidden = li.dataset.tf !== tf; if (!li.hidden) li.style.setProperty('--i', n++); });
  const w = el.querySelector('.when'); if (w) w.textContent = ch[tf][1] ? 'Chart from ' + when(ch[tf][1]) : '';
}
function slide(s){
  const side = s.side === 'buy' ? 'buy' : 'sell';
  let st = STATUS[s.status] ? s.status : 'waiting', dist = '';
  if (typeof s.price === 'number' && typeof s.zone_lo === 'number'){
    if (s.price >= s.zone_lo && s.price <= s.zone_hi){ if (st === 'waiting') st = 'at_zone'; }
    else if (st === 'waiting') dist = Math.round(Math.min(Math.abs(s.price - s.zone_lo), Math.abs(s.price - s.zone_hi)) / (isJPY(s.pair) ? .01 : .0001)) + ' pips to zone';
  }
  const ch = chartsOf(s), first = ch['4H'] || Object.values(ch)[0] || ['', ''];
  const v = first[1] ? '?v=' + encodeURIComponent(first[1]) : '';
  return `<article class="slide" data-pair="${esc(s.pair)}" data-charts="${esc(JSON.stringify(ch))}">
    <header class="cap"><button class="back" data-back aria-label="Back to the list of pairs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><span class="pair">${esc(s.pair)}</span><span class="tag ${side}">${side === 'buy' ? 'Buy' : 'Sell'}</span><span class="pk" hidden>${STAR}Pick</span></header>
    ${tabs(s)}
    <div class="pic"><img class="shot" src="${first[0]}${v}" alt="${esc(s.pair)} TradingView chart with entry, stop and target" tabindex="0"></div>
    <div class="levels">
      <div class="lv stop"><span>Stop</span><b>${px(s.pair, s.stop)}</b></div>
      <div class="lv"><span>Entry</span><b>${px(s.pair, s.entry)}</b></div>
      <div class="lv target"><span>Target</span><b>${px(s.pair, s.target)}${s.rr ? `<small>1:${esc(s.rr)}</small>` : ''}</b></div>
    </div>
    ${typeof s.score === 'number' ? `<div class="conf"><span>Confluence</span><b>${Math.round(s.score)}%</b><span class="meter" role="img" aria-label="Confluence ${Math.round(s.score)} percent; 70 is the minimum grade"><u style="--w:${Math.min(100, Math.max(0, s.score))}%"></u><em></em></span></div>` : ''}
    ${chips(s)}
    <p class="pickline" hidden>${STAR}<span></span></p>
    <div class="state"><span class="st ${st}">${STATUS[st]}</span>${dist ? `<span>${dist}</span>` : ''}<span class="when">${first[1] ? 'Chart from ' + esc(when(first[1])) : ''}</span></div>
    <div class="acts"><button class="took" data-took="${esc(s.pair)}" aria-pressed="false"><svg class="tick" viewBox="0 0 16 16" aria-hidden="true"><path pathLength="1" d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Mark as taken</span></button><button class="askp" data-ask="${esc(s.pair)}" aria-label="Ask Claude about ${esc(s.pair)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 1 3.4 6.5L4 19.5l1-3.3A8 8 0 0 1 4 12z"/><path d="M9 11h6M9 14h4"/></svg>Ask Claude</button></div>
  </article>`;
}
function draw(){
  const trades = (feed.setups || []).filter(s => s.status !== 'no_trade' && safeChart(s.chart))
    .sort((a,b) => (RANK[a.status] ?? 2) - (RANK[b.status] ?? 2) || (a.order ?? 99) - (b.order ?? 99));
  const chev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
  const list = trades.length ? trades.map((s, i) => { const hot = s.status === 'triggered' || s.status === 'at_zone' || (typeof s.price === 'number' && typeof s.zone_lo === 'number' && s.price >= s.zone_lo && s.price <= s.zone_hi);
      return `<button class="row" style="--i:${i}" data-open="${esc(s.pair)}"><span class="ico" data-pair="${esc(s.pair)}"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M9 8v20M18 5v24M27 10v18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><rect x="6" y="13" width="6" height="10" rx="1.5" fill="currentColor"/><rect x="15" y="10" width="6" height="12" rx="1.5" fill="currentColor"/><rect x="24" y="14" width="6" height="9" rx="1.5" fill="currentColor"/></svg></span><span class="nm">${esc(s.pair)}</span><span class="pk" hidden role="img" aria-label="Pick of the week">${STAR}</span><span class="tk" hidden>${TICK}<b>Taken</b></span>${typeof s.score === 'number' ? `<span class="pct">${Math.round(s.score)}%</span>` : ''}${hot ? '<i class="live" title="Price is at the zone"></i>' : ''}${chev}</button>`; }).join('') : `<div class="none">No pairs this week yet. They appear here after the weekly analysis.</div>`;
  if (list !== shownHome){ $('#rows').innerHTML = shownHome = list; sparks(); }
  $('#week').textContent = (feed.week && feed.week.label) || 'This week';
  const html = trades.map(slide).join('');
  if (html !== shown){ const deck = $('#deck'), x = deck.scrollLeft; deck.innerHTML = shown = html; deck.scrollLeft = x; if (view) deck.querySelectorAll('.slide').forEach(el => el.classList.toggle('cur', el.dataset.pair === view)); }
  document.querySelectorAll('#deck .slide').forEach(el => setTF(el, tfSel[el.dataset.pair] || '4H', false));
  markTaken(); markPick();
  if (view && !trades.some(s => s.pair === view)) show(null);
  $('#dots').innerHTML = trades.length > 1 ? trades.map(() => '<i></i>').join('') : ''; dots();
  const al = (feed.alerts || []).slice(0, 25);
  $('#alerts').innerHTML = al.length ? al.map(a => `<button class="a"><span class="h"><span>${esc(a.pair || 'Desk')}</span><time>${esc(when(a.at))}</time></span><p>${esc(a.text || '')}</p></button>`).join('') : '<div class="quiet">Nothing yet. A note appears here each time price reaches one of your zones.</div>';
  $('#bell').classList.toggle('new', (al[0] ? Date.parse(al[0].at) : 0) > Number(store.get('seen', 0)));
}
/* each row's icon: that pair's last 60 hourly closes as a small line chart, blue when it rose, red when it fell */
const sparkData = {};
async function sparks(){
  for (const el of document.querySelectorAll('.ico[data-pair]')){
    const p = el.dataset.pair;
    try {
      if (!sparkData[p]){ let d; try { d = await getJSON('data/bars/OANDA_' + p + '_1h.json'); } catch (e) { d = await getJSON(RAW + 'data/bars/OANDA_' + p + '_1h.json'); } sparkData[p] = (d.c || []).slice(-60); }
      const c = sparkData[p], n = c.length; if (n < 5 || !el.isConnected) continue;
      const lo = Math.min(...c), hi = Math.max(...c), X = i => 2 + i * (32 / (n - 1)), Y = v => 30 - (v - lo) / ((hi - lo) || 1) * 24;
      const pts = c.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
      el.className = 'ico ' + (c[n - 1] >= c[0] ? 'up' : 'down');
      el.innerHTML = `<svg viewBox="0 0 36 36" aria-hidden="true"><path class="f" d="${pts} L34 34 L2 34 Z" fill="currentColor"/><path class="l" pathLength="1" d="${pts}" stroke="currentColor"/><circle cx="${X(n - 1).toFixed(1)}" cy="${Y(c[n - 1]).toFixed(1)}" r="2.6" fill="currentColor"/></svg>`;
    } catch (e) {}
  }
}
function show(pair){
  view = pair || null;
  const deck = $('#deck');
  deck.querySelectorAll('.slide').forEach(x => x.classList.toggle('cur', x.dataset.pair === view));
  if (view){ const el = deck.querySelector('.slide.cur'); if (el) deck.scrollLeft = el.offsetLeft - deck.offsetLeft; dots(); }
  $('#app').classList.toggle('open', !!view);
  $('#detail').setAttribute('aria-hidden', view ? 'false' : 'true');
}
function dots(){ const deck = $('#deck'), i = Math.round(deck.scrollLeft / Math.max(1, deck.clientWidth)); document.querySelectorAll('#dots i').forEach((d, k) => d.classList.toggle('on', k === i));
  const el = deck.children[i]; if (view && el && el.dataset.pair !== view){ view = el.dataset.pair; [...deck.children].forEach(x => x.classList.toggle('cur', x === el)); } }
$('#deck').addEventListener('scroll', () => requestAnimationFrame(dots), {passive:true});
async function update(force){
  try { const v = await getJSON('version.json'); if (force || (v && v.build && v.build !== BUILD)) location.replace('./?v=' + encodeURIComponent((v && v.build) || Date.now())); }
  catch (e) { if (force) location.reload(); }
}
async function load(){
  if (document.hidden) return;
  update(false);
  const got = await Promise.allSettled([getJSON('data/feed.json'), getJSON(RAW + 'data/feed.json')]);
  const ok = got.filter(g => g.status === 'fulfilled' && g.value && g.value.updated).map(g => g.value).sort((a,b) => Date.parse(b.updated) - Date.parse(a.updated));
  if (ok.length){ if (!feed || Date.parse(ok[0].updated) > Date.parse(feed.updated)){ feed = ok[0]; draw(); } }
  else if (!feed) $('#deck').innerHTML = '<div class="none">The charts could not be loaded. Check the connection; the app retries by itself.</div>';
}
load(); setInterval(load, 5 * 60000); document.addEventListener('visibilitychange', load);

document.addEventListener('click', e => {
  const t = e.target;
  if (t.classList.contains('shot')){ $('#viewImg').src = t.src; $('#view').classList.remove('big'); $('#view').hidden = false; return; }
  if (t.id === 'viewImg'){ const v = $('#view'), big = v.classList.toggle('big'); if (big){ const r = t.getBoundingClientRect(); v.scrollLeft = (v.scrollWidth - v.clientWidth) * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); v.scrollTop = (v.scrollHeight - v.clientHeight) * Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)); } return; }
  if (t.id === 'viewClose'){ $('#view').hidden = true; return; }
  const open = t.closest('[data-open]'); if (open){ show(open.dataset.open); return; }
  if (t.closest('[data-back]')){ show(null); return; }
  const tf = t.closest('.tfs [data-tf]'); if (tf && !tf.disabled){ setTF(tf.closest('.slide'), tf.dataset.tf, true); return; }
  const tk = t.closest('[data-took]'); if (tk){ toggleTaken(tk.dataset.took); return; }
  const row = t.closest('.a'); if (row){ row.classList.toggle('open'); return; }
  if (t.closest('#bell')){ $('#sheet').hidden = false; const a = feed?.alerts?.[0]; if (a) store.set('seen', Date.parse(a.at)); $('#bell').classList.remove('new'); return; }
  if (t.id === 'refresh'){ t.textContent = 'Refreshing'; update(true); return; }
  if (t.id === 'close' || t.id === 'sheet') $('#sheet').hidden = true;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ $('#sheet').hidden = true; $('#view').hidden = true; } if (e.key === 'Enter' && e.target.classList?.contains('shot')) e.target.click(); });

/* ---------- notifications on this device ---------- */
const b64uToBytes = s => { s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
const bytesToB64u = b => { let s = ''; for (const x of b) s += String.fromCharCode(x); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
async function fingerprint(endpoint){ const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(endpoint))); return [...h.slice(0,4)].map(x => x.toString(16).padStart(2,'0')).join(''); }
/* The device code is this device's push address, encrypted so that only the notification sender can read it. */
async function deviceCode(sub, encPub){
  const serverPub = await crypto.subtle.importKey('raw', b64uToBytes(encPub), {name:'ECDH', namedCurve:'P-256'}, false, []);
  const eph = await crypto.subtle.generateKey({name:'ECDH', namedCurve:'P-256'}, true, ['deriveBits']);
  const shared = await crypto.subtle.deriveBits({name:'ECDH', public:serverPub}, eph.privateKey, 256);
  const key = await crypto.subtle.importKey('raw', await crypto.subtle.digest('SHA-256', shared), 'AES-GCM', false, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(sub))));
  const ephPub = new Uint8Array(await crypto.subtle.exportKey('raw', eph.publicKey));
  const all = new Uint8Array(ephPub.length + iv.length + ct.length); all.set(ephPub,0); all.set(iv,ephPub.length); all.set(ct,ephPub.length+iv.length);
  return 'SFD1.' + await fingerprint(sub.endpoint) + '.' + bytesToB64u(all);
}
const push = { cfg:null, reg:null };
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const canPush = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function dev(html){ $('#dev').innerHTML = `<div class="dev">${html}</div>`; }
async function pushUI(msg){
  if (!canPush()){
    if (isIOS() && !standalone()) return dev(`<p><b>Install the app to get notifications on this iPhone.</b></p><ol><li>Tap the Share button in Safari.</li><li>Choose <b>Add to Home Screen</b>.</li><li>Open <b>S&amp;F Desk</b> from the Home Screen and tap the bell.</li></ol>`);
    return dev(`<p>This browser cannot show notifications. On a Mac use Safari or Chrome; on an iPhone use Safari and add the app to the Home Screen.</p>`);
  }
  if (Notification.permission === 'denied') return dev(`<p><b>Notifications are blocked for this app.</b> Allow them in this device's notification settings for S&amp;F Desk, then reopen the app.</p>`);
  let sub = null; try { sub = push.reg ? await push.reg.pushManager.getSubscription() : null; } catch (e) {}

async function chatCall(key, messages, onText){
  const res = await fetch('https://api.anthropic.com/v1/messages', { method:'POST',
    headers:{ 'content-type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body:JSON.stringify({ model:CHAT_MODEL, max_tokens:3000, stream:true, system:CHAT_RULES + '\n\nApp data right now (JSON):\n' + chatContext(), tools:CHAT_TOOLS, messages }) });
  if (!res.ok){ let msg = ''; try { msg = (await res.json()).error.message || ''; } catch (e) {}
    throw Object.assign(new Error(msg || 'The request failed.'), { status:res.status }); }
  const blocks = [], json = {}; let stop = '';
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
  for (;;){ const { done, value } = await reader.read(); if (done) break; buf += dec.decode(value, { stream:true });
    let nl; while ((nl = buf.indexOf('\n')) >= 0){ const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
      if (!line.startsWith('data:')) continue; let ev; try { ev = JSON.parse(line.slice(5)); } catch (e) { continue; }
      if (ev.type === 'error') throw new Error((ev.error && ev.error.message) || 'Claude stopped with an error.');
      if (ev.type === 'content_block_start' && ev.content_block){ const c = ev.content_block;
        if (c.type === 'tool_use'){ blocks[ev.index] = { type:'tool_use', id:c.id, name:c.name, input:{} }; json[ev.index] = ''; }
        else if (c.type === 'text') blocks[ev.index] = { type:'text', text:c.text || '' }; }
      else if (ev.type === 'content_block_delta' && ev.delta){ const bl = blocks[ev.index] || (blocks[ev.index] = { type:'text', text:'' });
        if (ev.delta.type === 'text_delta' && bl.type === 'text'){ bl.text += ev.delta.text; onText(ev.delta.text); }
        else if (ev.delta.type === 'input_json_delta') json[ev.index] = (json[ev.index] || '') + (ev.delta.partial_json || ''); }
      else if (ev.type === 'content_block_stop'){ const bl = blocks[ev.index]; if (bl && bl.type === 'tool_use'){ try { bl.input = json[ev.index] ? JSON.parse(json[ev.index]) : {}; } catch (e) { bl.input = {}; } } }
      else if (ev.type === 'message_delta' && ev.delta && ev.delta.stop_reason) stop = ev.delta.stop_reason; } }
  return { blocks:blocks.filter(x => x && (x.type !== 'text' || x.text)), stop };
}
async function chatSend(text){
  text = String(text || '').trim(); const key = chatKey(); if (!text || chatBusy || !key) return;
  const id = chatId, log = chatLog, pair = chatPair(); const here = () => chatId === id && !$('#chat').hidden;
  chatErr = ''; chatStat = ''; chatBusy = true; busyId = id; log.push({ role:'user', text }); $('#cin').value = ''; chatGrow(); chatDraw();
  const reply = { role:'assistant', text:'' }; let started = false;
  const onText = d => { reply.text += d; if (!started){ started = true; log.push(reply); }
    if (!here()) return; const live = document.getElementById('clive');
    if (chatStat || !live){ chatStat = ''; chatDraw(); } else { live.innerHTML = md(reply.text); const b = $('#cbody'); b.scrollTop = b.scrollHeight; } };
  try {
    const charts = pair ? await chartBlocks(pair) : [];
    const hist = log.slice(-24); while (hist.length && hist[0].role !== 'user') hist.shift();
    const messages = hist.map(m => ({ role:m.role, content:[{ type:'text', text:m.text }] }));
    if (charts.length) messages[0].content = [{ type:'text', text:`Charts for ${pair}, the trade this chat is about:` }, ...charts, ...messages[0].content];
    for (let round = 0; round < 14; round++){
      const r = await chatCall(key, messages, onText);
      if (r.stop === 'max_tokens') onText('\n\n(The answer was cut short. Ask me to continue.)');
      const uses = r.blocks.filter(x => x.type === 'tool_use'); if (r.stop !== 'tool_use' || !uses.length) break;
      messages.push({ role:'assistant', content:r.blocks });
      const results = [];
      for (const u of uses){ chatStat = toolSay(u.name, u.input); if (here()) chatDraw();
        let out; try { out = await runTool(u.name, u.input); } catch (e) { out = 'The tool failed: ' + String(e && e.message || e).slice(0, 200); }
        results.push({ type:'tool_result', tool_use_id:u.id, content:String(out) }); }
      messages.push({ role:'user', content:results });
      if (reply.text && !/\n\n$/.test(reply.text)) reply.text += '\n\n';
      chatStat = 'Thinking it through'; if (here()) chatDraw();
    }
    reply.text = reply.text.trim();
    if (!started || !reply.text) throw new Error('Claude sent an empty reply. Try again.');
    chatSave();
  } catch (err) {
    reply.text = reply.text.trim();
    if (log.length && log[log.length - 1] === reply && reply.text) chatSave();
    else { if (log[log.length - 1] === reply) log.pop(); while (log.length && log[log.length - 1].role !== 'user') log.pop(); const u = log.pop(); if (u && here() && !$('#cin').value) $('#cin').value = u.text; }
    const m = String(err && err.message || '');
    const say = err.status === 401 ? (/CORS/i.test(m) ? 'This key\'s organization does not allow use from an app. Create a key in a personal Console account and save it here.' : 'The key was not accepted. Remove it and save a valid one.')
      : err.status === 429 || err.status === 529 ? 'Claude is busy or the key has hit its limit. Try again in a minute.'
      : err.status ? 'Claude could not answer: ' + (m || 'error ' + err.status) : m && !/fetch|network|load failed/i.test(m) ? m : 'Could not reach Claude. Check your connection and try again.';
    if (here()) chatErr = say;
  }
  chatBusy = false; busyId = ''; chatStat = ''; if (!$('#chat').hidden){ chatDraw(); chatGrow(); }
}
function chatGrow(){ const t = $('#cin'); t.style.height = 'auto'; t.style.height = Math.min(132, t.scrollHeight) + 'px'; $('#csend').disabled = chatBusy || !t.value.trim(); }
$('#cin').addEventListener('input', chatGrow);
$('#cin').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); chatSend($('#cin').value); } });
$('#cform').addEventListener('submit', e => { e.preventDefault(); chatSend($('#cin').value); });
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#askHome') || t.closest('#pickrow')){ chatOpen('home'); return; }
  const ap = t.closest('[data-ask]'); if (ap){ chatOpen(ap.dataset.ask); return; }
  if (t.id === 'chatClose'){ $('#chat').hidden = true; return; }
  if (t.id === 'chatNew'){ if (chatBusy) return; chatLog = chats[chatId] = []; chatErr = ''; chatSave(); chatDraw(); return; }
  if (t.id === 'ckeySave'){ const v = ($('#ckeyIn').value || '').trim(); if (v.length < 20 || /\s/.test(v)){ chatKeyNote = 'That does not look like an API key.'; chatDraw(); return; } chatKeyNote = ''; store.set('ckey', v); chatDraw(); $('#cin').focus(); return; }
  if (t.id === 'ckeyDrop'){ try { localStorage.removeItem('ckey'); } catch (err) {} chatErr = ''; chatDraw(); return; }
  const sg = t.closest('[data-sug]'); if (sg){ chatSend(sg.dataset.sug); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#chat').hidden = true; });
</script>
