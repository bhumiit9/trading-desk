<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Set & Forget Desk</title>
<meta name="description" content="This week's trades: one TradingView chart per trade with entry, stop and target, plus notifications.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="S&F Desk">
<meta name="theme-color" content="#ffffff">
<style>
/* The app opens on a plain list of this week's pairs. Tapping a pair opens its chart with stop, entry and target;
   swipe sideways there for the next pair. The notification log and device setup sit behind the bell. */
:root{
  --bg:#ffffff; --surf:#F1F4FA; --ink:#0F1B33; --mute:#5A6782; --line:#E1E6F0;
  --sell:#D93A3F; --buy:#0B8A5F; --amber-ink:#8A5300; --amber-bg:#FFF2D0; --link:#2962FF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.35 var(--font);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.app{position:relative;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
[hidden]{display:none !important}
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
.home,.detail{position:absolute;inset:0;transition:transform .38s cubic-bezier(.22,.8,.24,1),opacity .38s ease}
.home{overflow-y:auto;padding-top:56px;-webkit-overflow-scrolling:touch}
.detail{display:flex;flex-direction:column;background:var(--bg);transform:translateX(100%);visibility:hidden;transition:transform .38s cubic-bezier(.22,.8,.24,1),visibility 0s .38s;box-shadow:-12px 0 30px rgba(15,27,51,.08)}
.app.open .detail{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.22,.8,.24,1),visibility 0s}
.app.open .home{transform:translateX(-24%);opacity:.35}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes settle{from{opacity:0;transform:scale(1.035)}to{opacity:1;transform:none}}
@keyframes ring{0%,100%{transform:rotate(0)}12%{transform:rotate(16deg)}28%{transform:rotate(-13deg)}44%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}78%{transform:rotate(3deg)}}
@keyframes candle{from{height:10px}to{height:40px}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,163,0,.55)}100%{box-shadow:0 0 0 12px rgba(245,163,0,0)}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.loader{margin:auto;display:flex;gap:8px;align-items:center;height:48px}
.loader i{width:9px;border-radius:2px;background:var(--link);animation:candle .9s ease-in-out infinite alternate}
.loader i:nth-child(2){background:var(--sell);animation-delay:.18s} .loader i:nth-child(3){animation-delay:.36s}
.none.wait{display:flex;height:60%}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;height:72px;padding:0 18px;border-top:1px solid var(--line);font-size:25px;font-weight:700;letter-spacing:-.02em;
  animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 75ms + 60ms);transition:background .15s}
.row span{flex:1}
.row .live{width:10px;height:10px;border-radius:50%;background:#F5A300;animation:pulse 1.6s ease-out infinite}
.row:last-child{border-bottom:1px solid var(--line)}
.row:active{background:var(--surf)}
.row svg{width:20px;height:20px;color:#A9B3C6;flex:none;transition:transform .2s}
.row:active svg{transform:translateX(5px)}
.slide.cur .shot{animation:settle .55s cubic-bezier(.2,.8,.2,1) both}
.slide.cur .lv{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:.16s}
.slide.cur .lv:nth-child(2){animation-delay:.24s} .slide.cur .lv:nth-child(3){animation-delay:.32s}
.slide.cur .state{animation:rise .5s cubic-bezier(.2,.8,.2,1) .4s both}
.bell svg{transform-origin:50% 12%} .bell.new svg{animation:ring 1.1s ease-in-out .9s 1}
.sheet{animation:fade .2s ease} .sheet .panel{animation:sheetUp .34s cubic-bezier(.2,.8,.2,1)}
.view{animation:fade .2s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
.back{width:44px;height:44px;margin-left:-12px;margin-right:-6px;display:grid;place-items:center}
.back svg{width:24px;height:24px}
.bell{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 6px);right:calc(env(safe-area-inset-right,0px) + 8px);width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.bell svg{width:25px;height:25px}
.bell i{position:absolute;top:8px;right:9px;width:10px;height:10px;border-radius:50%;background:#F5A300;border:2px solid var(--bg);display:none}
.bell.new i{display:block}
.deck{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.deck::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column}
.cap{display:flex;align-items:center;gap:10px;height:56px;padding:0 60px 0 18px}
.pair{font-size:26px;font-weight:700;letter-spacing:-.02em}
.tag{font-size:13px;font-weight:700;border-radius:6px;padding:3px 9px}
.tag.sell{color:var(--sell);background:rgba(217,58,63,.12)} .tag.buy{color:var(--buy);background:rgba(11,138,95,.13)}
.pic{flex:1;min-height:0;border-block:1px solid var(--line);display:flex}
.shot{width:100%;height:100%;object-fit:contain;object-position:center top;cursor:zoom-in;display:block}
.levels{display:grid;grid-template-columns:repeat(3,1fr);padding:12px 18px 4px;gap:8px}
.lv span{display:block;font-size:13px;color:var(--mute)}
.lv b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.lv.stop b{color:var(--sell)} .lv.target b{color:var(--buy)}
.lv small{font-size:13px;font-weight:600;color:var(--buy);margin-left:5px}
.state{display:flex;align-items:center;gap:8px;padding:6px 18px 10px;font-size:14px;color:var(--mute)}
.st{font-weight:600;color:var(--ink);background:var(--surf);border-radius:999px;padding:3px 11px}
.st.at_zone{color:var(--amber-ink);background:var(--amber-bg)} .st.triggered{color:#fff;background:var(--buy)} .st.invalid{color:var(--sell)}
.state .when{margin-left:auto;font-size:12.5px;white-space:nowrap}
.dots{display:flex;justify-content:center;gap:7px;padding:2px 0 12px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)} .dots i.on{background:var(--ink)}
.none{margin:auto;padding:40px 28px;text-align:center;color:var(--mute)}
@media (min-width:800px){ body{background:var(--surf)} .app{max-width:520px;margin:0 auto;background:var(--bg);box-shadow:0 0 0 1px var(--line)} }
.view{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;display:flex}
.view[hidden]{display:none}
.view img{margin:auto;width:100%;max-width:min(100%,80dvh);height:auto;cursor:zoom-in}
.view.big img{width:230%;max-width:none;cursor:zoom-out}
.view button{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:31;background:var(--ink);color:#fff;font-weight:600;border-radius:999px;padding:11px 18px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(15,27,51,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:min(100%,560px);max-height:86dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:800px){.sheet{align-items:center}.panel{border-radius:18px;max-height:80dvh}}
.phead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 8px}
.phead h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.phead button{font-weight:600;color:var(--link);padding:11px 6px}
.pbody{overflow-y:auto;padding:0 18px 18px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.dev{background:var(--surf);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:9px;font-size:14.5px}
.dev p{margin:0} .dev ol{margin:0;padding-left:20px} .dev b{font-weight:600}
.btn{align-self:flex-start;font-weight:600;color:#fff;background:var(--ink);border-radius:10px;padding:12px 18px}
.code{width:100%;height:64px;font:11.5px ui-monospace,Menlo,monospace;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;resize:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--buy);margin-right:7px}
.a{display:block;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.a:first-child{border-top:0}
.a .h{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.a .h time{font-weight:400;font-size:13px;color:var(--mute);white-space:nowrap}
.a p{margin:2px 0 0;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a.open p{display:block}
.quiet{color:var(--mute);font-size:14.5px;padding:6px 0}
.foot{font-size:12.5px;color:var(--mute);line-height:1.45}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
</style>
</head>
<body>
<div class="app" id="app">
  <button class="bell" id="bell" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><i></i></button>
  <div class="stage">
    <main class="home" id="home"><div class="none wait" role="status" aria-label="Loading this week's pairs"><div class="loader"><i></i><i></i><i></i></div></div></main>
    <section class="detail" id="detail" aria-hidden="true">
      <div class="deck" id="deck"></div>
      <nav class="dots" id="dots" aria-hidden="true"></nav>
    </section>
  </div>
</div>

<div class="view" id="view" hidden><button id="viewClose">Close</button><img id="viewImg" alt=""></div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-label="Notifications">
    <div class="phead"><h2>Notifications</h2><span><button id="refresh">Refresh</button>&ensp;<button id="close">Done</button></span></div>
    <div class="pbody">
      <div id="dev"></div>
      <div id="alerts"></div>
      <div class="foot">Entries on the charts are plans. They count only after the 1H shift of structure and a closed entry candle at the zone. Rule-based analysis, not financial advice. The trade decision is yours.</div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RAW = 'https://raw.githubusercontent.com/bhumiit9/trading-desk/main/';
const store = { get(k, d){ try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} } };
const STATUS = { waiting:'Waiting', at_zone:'At the zone', triggered:'Trigger seen', invalid:'Idea failed' };
const RANK = { triggered:0, at_zone:1, waiting:2, invalid:3 };
const BUILD = '2026-11-11.7';
let feed = null, shown = '', shownHome = '', view = null;
const isJPY = p => /JPY/.test(p);
const px = (p, v) => typeof v === 'number' ? v.toFixed(isJPY(p) ? 3 : 4) : '–';
const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString([], {weekday:'short', hour:'numeric', minute:'2-digit'}); };
const safeChart = c => (typeof c === 'string' && /^charts\/[a-z0-9_-]+\.(png|jpg)$/.test(c)) ? c : null;
async function getJSON(url){ const r = await fetch(url + '?t=' + Date.now(), {cache:'no-store'}); if (!r.ok) throw new Error(r.status); return r.json(); }

function slide(s){
  const side = s.side === 'buy' ? 'buy' : 'sell';
  let st = STATUS[s.status] ? s.status : 'waiting', dist = '';
  if (typeof s.price === 'number' && typeof s.zone_lo === 'number'){
    if (s.price >= s.zone_lo && s.price <= s.zone_hi){ if (st === 'waiting') st = 'at_zone'; }
    else if (st === 'waiting') dist = Math.round(Math.min(Math.abs(s.price - s.zone_lo), Math.abs(s.price - s.zone_hi)) / (isJPY(s.pair) ? .01 : .0001)) + ' pips to zone';
  }
  const v = s.shot_at ? '?v=' + encodeURIComponent(s.shot_at) : '';
  return `<article class="slide" data-pair="${esc(s.pair)}">
    <header class="cap"><button class="back" data-back aria-label="Back to the list of pairs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><span class="pair">${esc(s.pair)}</span><span class="tag ${side}">${side === 'buy' ? 'Buy' : 'Sell'}</span></header>
    <div class="pic"><img class="shot" src="${safeChart(s.chart)}${v}" alt="${esc(s.pair)} TradingView chart with entry, stop and target" tabindex="0"></div>
    <div class="levels">
      <div class="lv stop"><span>Stop</span><b>${px(s.pair, s.stop)}</b></div>
      <div class="lv"><span>Entry</span><b>${px(s.pair, s.entry)}</b></div>
      <div class="lv target"><span>Target</span><b>${px(s.pair, s.target)}${s.rr ? `<small>1:${esc(s.rr)}</small>` : ''}</b></div>
    </div>
    <div class="state"><span class="st ${st}">${STATUS[st]}</span>${dist ? `<span>${dist}</span>` : ''}${s.shot_at ? `<span class="when">Chart from ${esc(when(s.shot_at))}</span>` : ''}</div>
  </article>`;
}
function draw(){
  const trades = (feed.setups || []).filter(s => s.status !== 'no_trade' && safeChart(s.chart))
    .sort((a,b) => (RANK[a.status] ?? 2) - (RANK[b.status] ?? 2) || (a.order ?? 99) - (b.order ?? 99));
  const chev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
  const list = trades.length ? trades.map((s, i) => { const hot = s.status === 'triggered' || s.status === 'at_zone' || (typeof s.price === 'number' && typeof s.zone_lo === 'number' && s.price >= s.zone_lo && s.price <= s.zone_hi);
      return `<button class="row" style="--i:${i}" data-open="${esc(s.pair)}"><span>${esc(s.pair)}</span>${hot ? '<i class="live" title="Price is at the zone"></i>' : ''}${chev}</button>`; }).join('') : `<div class="none">No pairs this week yet. They appear here after the weekly analysis.</div>`;
  if (list !== shownHome) $('#home').innerHTML = shownHome = list;
  const html = trades.map(slide).join('');
  if (html !== shown){ const deck = $('#deck'), x = deck.scrollLeft; deck.innerHTML = shown = html; deck.scrollLeft = x; }
  if (view && !trades.some(s => s.pair === view)) show(null);
  $('#dots').innerHTML = trades.length > 1 ? trades.map(() => '<i></i>').join('') : ''; dots();
  const al = (feed.alerts || []).slice(0, 25);
  $('#alerts').innerHTML = al.length ? al.map(a => `<button class="a"><span class="h"><span>${esc(a.pair || 'Desk')}</span><time>${esc(when(a.at))}</time></span><p>${esc(a.text || '')}</p></button>`).join('') : '<div class="quiet">Nothing yet. A note appears here each time price reaches one of your zones.</div>';
  $('#bell').classList.toggle('new', (al[0] ? Date.parse(al[0].at) : 0) > Number(store.get('seen', 0)));
}
function show(pair){
  view = pair || null;
  const deck = $('#deck');
  deck.querySelectorAll('.slide').forEach(x => x.classList.toggle('cur', x.dataset.pair === view));
  if (view){ const el = deck.querySelector('.slide.cur'); if (el) deck.scrollLeft = el.offsetLeft - deck.offsetLeft; dots(); }
  $('#app').classList.toggle('open', !!view);
  $('#detail').setAttribute('aria-hidden', view ? 'false' : 'true');
}
function dots(){ const deck = $('#deck'), i = Math.round(deck.scrollLeft / Math.max(1, deck.clientWidth)); document.querySelectorAll('#dots i').forEach((d, k) => d.classList.toggle('on', k === i)); }
$('#deck').addEventListener('scroll', () => requestAnimationFrame(dots), {passive:true});
async function update(force){
  try { const v = await getJSON('version.json'); if (force || (v && v.build && v.build !== BUILD)) location.replace('./?v=' + encodeURIComponent((v && v.build) || Date.now())); }
  catch (e) { if (force) location.reload(); }
}
async function load(){
  if (document.hidden) return;
  update(false);
  const got = await Promise.allSettled([getJSON('data/feed.json'), getJSON(RAW + 'data/feed.json')]);
  const ok = got.filter(g => g.status === 'fulfilled' && g.value && g.value.updated).map(g => g.value).sort((a,b) => Date.parse(b.updated) - Date.parse(a.updated));
  if (ok.length){ if (!feed || Date.parse(ok[0].updated) > Date.parse(feed.updated)){ feed = ok[0]; draw(); } }
  else if (!feed) $('#deck').innerHTML = '<div class="none">The charts could not be loaded. Check the connection; the app retries by itself.</div>';
}
load(); setInterval(load, 5 * 60000); document.addEventListener('visibilitychange', load);

document.addEventListener('click', e => {
  const t = e.target;
  if (t.classList.contains('shot')){ $('#viewImg').src = t.src; $('#view').classList.remove('big'); $('#view').hidden = false; return; }
  if (t.id === 'viewImg'){ const v = $('#view'), big = v.classList.toggle('big'); if (big){ const r = t.getBoundingClientRect(); v.scrollLeft = (v.scrollWidth - v.clientWidth) * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); v.scrollTop = (v.scrollHeight - v.clientHeight) * Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)); } return; }
  if (t.id === 'viewClose'){ $('#view').hidden = true; return; }
  const open = t.closest('[data-open]'); if (open){ show(open.dataset.open); return; }
  if (t.closest('[data-back]')){ show(null); return; }
  const row = t.closest('.a'); if (row){ row.classList.toggle('open'); return; }
  if (t.closest('#bell')){ $('#sheet').hidden = false; const a = feed?.alerts?.[0]; if (a) store.set('seen', Date.parse(a.at)); $('#bell').classList.remove('new'); return; }
  if (t.id === 'refresh'){ t.textContent = 'Refreshing'; update(true); return; }
  if (t.id === 'close' || t.id === 'sheet') $('#sheet').hidden = true;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ $('#sheet').hidden = true; $('#view').hidden = true; } if (e.key === 'Enter' && e.target.classList?.contains('shot')) e.target.click(); });

/* ---------- notifications on this device ---------- */
const b64uToBytes = s => { s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
const bytesToB64u = b => { let s = ''; for (const x of b) s += String.fromCharCode(x); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
async function fingerprint(endpoint){ const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(endpoint))); return [...h.slice(0,4)].map(x => x.toString(16).padStart(2,'0')).join(''); }
/* The device code is this device's push address, encrypted so that only the notification sender can read it. */
async function deviceCode(sub, encPub){
  const serverPub = await crypto.subtle.importKey('raw', b64uToBytes(encPub), {name:'ECDH', namedCurve:'P-256'}, false, []);
  const eph = await crypto.subtle.generateKey({name:'ECDH', namedCurve:'P-256'}, true, ['deriveBits']);
  const shared = await crypto.subtle.deriveBits({name:'ECDH', public:serverPub}, eph.privateKey, 256);
  const key = await crypto.subtle.importKey('raw', await crypto.subtle.digest('SHA-256', shared), 'AES-GCM', false, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(sub))));
  const ephPub = new Uint8Array(await crypto.subtle.exportKey('raw', eph.publicKey));
  const all = new Uint8Array(ephPub.length + iv.length + ct.length); all.set(ephPub,0); all.set(iv,ephPub.length); all.set(ct,ephPub.length+iv.length);
  return 'SFD1.' + await fingerprint(sub.endpoint) + '.' + bytesToB64u(all);
}
const push = { cfg:null, reg:null };
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const canPush = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function dev(html){ $('#dev').innerHTML = `<div class="dev">${html}</div>`; }
async function pushUI(msg){
  if (!canPush()){
    if (isIOS() && !standalone()) return dev(`<p><b>Install the app to get notifications on this iPhone.</b></p><ol><li>Tap the Share button in Safari.</li><li>Choose <b>Add to Home Screen</b>.</li><li>Open <b>S&amp;F Desk</b> from the Home Screen and tap the bell.</li></ol>`);
    return dev(`<p>This browser cannot show notifications. On a Mac use Safari or Chrome; on an iPhone use Safari and add the app to the Home Screen.</p>`);
  }
  if (Notification.permission === 'denied') return dev(`<p><b>Notifications are blocked for this app.</b> Allow them in this device's notification settings for S&amp;F Desk, then reopen the app.</p>`);
  let sub = null; try { sub = push.reg ? await push.reg.pushManager.getSubscription() : null; } catch (e) {}
  if (!sub) return dev(`<p>Get a notification on this device each time price reaches one of your zones.</p><button class="btn" id="pushOn">Turn on notifications</button>${msg ? `<p>${esc(msg)}</p>` : ''}`);
  let code = ''; try { code = await deviceCode(sub.toJSON(), push.cfg.encPublicKey); } catch (e) { return dev(`<p>Notifications are on, but the device code could not be made (${esc(e.message)}).</p>`); }
  const fp = code.split('.')[1];
  if ((push.cfg.devices || []).some(d => d && d.fp === fp)) return dev(`<p><span class="dot"></span><b>Notifications are on for this device.</b></p>`);
  dev(`<p><b>One last step:</b> copy this device code and send it to Claude in your chat.</p><textarea class="code" id="devCode" readonly>${esc(code)}</textarea><button class="btn" id="copyCode">Copy device code</button><p id="copyNote" style="color:var(--mute);font-size:12.5px">The code is encrypted. It only lets the Desk send notifications to this device.</p>`);
}
document.addEventListener('click', async e => {
  if (e.target.id === 'pushOn'){
    e.target.disabled = true;
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') return pushUI(perm === 'denied' ? '' : 'Notifications were not allowed. Tap the button to try again.');
      await push.reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64uToBytes(push.cfg.vapidPublicKey) });
      pushUI();
    } catch (err) { pushUI('Could not turn notifications on: ' + err.message); }
  }
  if (e.target.id === 'copyCode'){
    const ta = $('#devCode');
    try { await navigator.clipboard.writeText(ta.value); $('#copyNote').textContent = 'Copied. Paste it into your chat with Claude.'; }
    catch (err) { ta.focus(); ta.select(); $('#copyNote').textContent = 'Select the code above and copy it, then paste it into your chat with Claude.'; }
  }
});
(async () => {
  try { push.cfg = await getJSON('push/config.json'); } catch (e) { return; }
  if ('serviceWorker' in navigator){ try { push.reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready; } catch (e) {} }
  pushUI();
})();
</script>
</body>
