<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Set & Forget Desk</title>
<meta name="description" content="This week's trades: one TradingView chart per trade with entry, stop and target, plus notifications.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="S&F Desk">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* The app opens on a plain list of this week's pairs. Tapping a pair opens its chart with stop, entry and target;
   swipe sideways there for the next pair. The notification log and device setup sit behind the bell. */
:root{
  --bg:#000000; --surf:#14171C; --ink:#F3F5F9; --mute:#8E98AC; --line:#23272F;
  --sell:#FF5C61; --buy:#1FC98E; --amber-ink:#FFC65C; --amber-bg:#3A2A08; --link:#6C9BFF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.35 var(--font);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.app{position:relative;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
[hidden]{display:none !important}
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
.home,.detail{position:absolute;inset:0;transition:transform .38s cubic-bezier(.22,.8,.24,1),opacity .38s ease}
.home{overflow-y:auto;padding:10px 14px 24px;-webkit-overflow-scrolling:touch}
.title{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:44px;margin:0;padding:0 104px 10px 6px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.rows{display:flex;flex-direction:column;gap:10px}
.detail{display:flex;flex-direction:column;background:var(--bg);transform:translateX(100%);visibility:hidden;transition:transform .38s cubic-bezier(.22,.8,.24,1),visibility 0s .38s;box-shadow:-1px 0 0 var(--line)}
.app.open .detail{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.22,.8,.24,1),visibility 0s}
.app.open .home{transform:translateX(-24%);opacity:.35}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes settle{from{opacity:0;transform:scale(1.035)}to{opacity:1;transform:none}}
@keyframes ring{0%,100%{transform:rotate(0)}12%{transform:rotate(16deg)}28%{transform:rotate(-13deg)}44%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}78%{transform:rotate(3deg)}}
@keyframes candle{from{height:10px}to{height:40px}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,163,0,.55)}100%{box-shadow:0 0 0 12px rgba(245,163,0,0)}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.loader{margin:auto;display:flex;gap:8px;align-items:center;height:48px}
.loader i{width:9px;border-radius:2px;background:var(--link);animation:candle .9s ease-in-out infinite alternate}
.loader i:nth-child(2){background:var(--sell);animation-delay:.18s} .loader i:nth-child(3){animation-delay:.36s}
.none.wait{display:flex;height:60%}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;height:78px;padding:0 16px 0 14px;border-radius:20px;background:var(--surf);font-size:24px;font-weight:700;letter-spacing:-.02em;
  animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 75ms + 90ms);transition:transform .15s,background .15s}
.row:active{transform:scale(.98);background:#1D2129}
.row .nm{flex:1;min-width:0}
/* the icon is the pair's own last 60 hours, drawn as a small chart */
.ico{flex:none;width:50px;height:50px;border-radius:15px;background:#000;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);color:#5E6878}
.ico.up{color:#6C9BFF} .ico.down{color:#FF5C61}
.ico svg{width:36px;height:36px;overflow:visible}
.ico .l{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:drawline 1s cubic-bezier(.3,.7,.2,1) .1s forwards}
.ico .f{opacity:0;animation:fadeTo .6s ease .7s forwards}
.ico circle{opacity:0;animation:fade .3s ease 1s forwards}
@keyframes drawline{to{stroke-dashoffset:0}}
@keyframes fadeTo{to{opacity:.2}}
.row .pct{font-size:17px;font-weight:700;color:var(--mute);letter-spacing:0;text-align:right}
.row .tk{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 6px;margin-right:-2px;border-radius:12px;font-size:12.5px;font-weight:700;letter-spacing:0;flex:none;color:#00140C;background:var(--buy);animation:pop .4s cubic-bezier(.2,.9,.3,1.2) both}
.row .tk[hidden]{display:none} .row .tk svg{width:13px;height:13px}
@media (max-width:359px){ .row .tk b{display:none} .row .tk{padding:0 6px} }
.took{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 18px 10px;height:46px;flex:none;border-radius:14px;font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:var(--surf);border:0;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:background .25s,color .25s,transform .12s}
.took:active{transform:scale(.98)} .took svg{width:18px;height:18px}
.took .tick path{stroke-dasharray:1;stroke-dashoffset:1}
.took.on{background:var(--buy);color:#00140C;box-shadow:none} .took.on .tick path{stroke-dashoffset:0;transition:stroke-dashoffset .35s ease-out .05s}
.took:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.slide.cur .took{animation:rise .5s cubic-bezier(.2,.8,.2,1) .5s both}
.row .live{width:10px;height:10px;border-radius:50%;background:#F5A300;animation:pulse 1.6s ease-out infinite}
.row > svg{width:20px;height:20px;color:#5E6878;flex:none;transition:transform .2s}
.row:active > svg{transform:translateX(5px)}
.slide.cur .shot{animation:settle .55s cubic-bezier(.2,.8,.2,1) both}
.slide.cur .lv{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:.16s}
.slide.cur .lv:nth-child(2){animation-delay:.24s} .slide.cur .lv:nth-child(3){animation-delay:.32s}
.slide.cur .state{animation:rise .5s cubic-bezier(.2,.8,.2,1) .4s both}
.bell svg{transform-origin:50% 12%} .bell.new svg{animation:ring 1.1s ease-in-out .9s 1}
.sheet{animation:fade .2s ease} .sheet .panel{animation:sheetUp .34s cubic-bezier(.2,.8,.2,1)}
.view{animation:fade .2s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
.back{width:44px;height:44px;margin-left:-12px;margin-right:-6px;display:grid;place-items:center}
.back svg{width:24px;height:24px}
.ask{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 6px);right:calc(env(safe-area-inset-right,0px) + 54px);width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.ask svg{width:25px;height:25px}
.chat{position:fixed;left:0;right:0;top:0;height:var(--vvh,100dvh);z-index:25;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);animation:sheetUp .32s cubic-bezier(.2,.8,.2,1)}
.chat[hidden]{display:none}
.chat > *{width:min(100%,560px);margin-inline:auto}
.chead{display:flex;align-items:center;gap:10px;height:56px;flex:none;padding:0 12px 0 18px}
.chead h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;white-space:nowrap}
.chead .cctx{font-size:13px;font-weight:600;color:var(--mute);background:var(--surf);border-radius:999px;padding:3px 10px;white-space:nowrap}
.chead .cctx:empty{display:none}
.chead .grow{flex:1}
.chead button{font-weight:600;color:var(--link);padding:11px 6px;white-space:nowrap}
.chead .cctx{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px 14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:100%;font-size:16px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
.msg.me{align-self:flex-end;max-width:86%;background:var(--surf);border-radius:18px 18px 4px 18px;padding:9px 14px}
.msg.err{color:var(--sell);font-size:14.5px}
.msg .loader{height:26px;margin:0;gap:5px} .msg .loader i{width:6px;animation-name:candleS}
@keyframes candleS{from{height:6px}to{height:22px}}
.cstart{margin:auto 0 0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.cstart p{margin:0 0 4px;color:var(--mute);font-size:15px}
.sug{text-align:left;font-size:15px;font-weight:600;color:var(--ink);background:var(--surf);border-radius:14px;padding:11px 14px;animation:rise .4s cubic-bezier(.2,.8,.2,1) calc(var(--i)*.06s) both}
.sug:active{background:#1D2129}
.linkbtn{font-size:13px;color:var(--mute);text-decoration:underline;padding:10px 0}
.ckey{margin:auto 0;display:flex;flex-direction:column;gap:12px}
.ckey h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.ckey p{margin:0;color:var(--mute);font-size:15px;line-height:1.45}
.ckey input{font:inherit;font-size:16px;color:var(--ink);background:var(--surf);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:13px 14px;width:100%}
.ckey input:focus-visible,.cform textarea:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.ckey .note{font-size:13.5px;color:var(--sell);min-height:1.2em}
.cform{display:flex;align-items:flex-end;gap:8px;flex:none;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.cform[hidden]{display:none}
.cform textarea{flex:1;font:inherit;font-size:16px;line-height:1.35;color:var(--ink);background:var(--surf);border:0;border-radius:20px;padding:11px 16px;resize:none;max-height:132px;min-height:44px}
.cform textarea::placeholder,.ckey input::placeholder{color:#6B7486}
.cform button{flex:none;width:44px;height:44px;border-radius:50%;background:var(--link);color:#000;display:grid;place-items:center;transition:opacity .2s,transform .12s}
.cform button:disabled{opacity:.35} .cform button:active{transform:scale(.94)} .cform button svg{width:20px;height:20px}
.cnote{flex:none;font-size:11.5px;color:#6B7486;text-align:center;padding:0 18px 4px}
.bell{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 6px);right:calc(env(safe-area-inset-right,0px) + 8px);width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.bell svg{width:25px;height:25px}
.bell i{position:absolute;top:8px;right:9px;width:10px;height:10px;border-radius:50%;background:#F5A300;border:2px solid var(--bg);display:none}
.bell.new i{display:block}
.deck{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.deck::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}
.cap{display:flex;align-items:center;gap:10px;height:56px;flex:none;padding:0 106px 0 18px;position:sticky;top:0;z-index:2;background:var(--bg)}
.pair{font-size:26px;font-weight:700;letter-spacing:-.02em}
.tag{font-size:13px;font-weight:700;border-radius:6px;padding:3px 9px}
.tag.sell{color:var(--sell);background:rgba(255,92,97,.16)} .tag.buy{color:var(--buy);background:rgba(31,201,142,.16)}
.tfs{position:relative;display:grid;grid-template-columns:repeat(4,1fr);flex:none;margin:0 10px 8px;padding:3px;border-radius:13px;background:var(--surf)}
.tfs::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/4);border-radius:10px;background:#2B3140;transform:translateX(calc(var(--k,2)*100%));transition:transform .32s cubic-bezier(.3,.8,.3,1)}
.tfs button{position:relative;height:34px;border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--mute);cursor:pointer;border-radius:10px;white-space:nowrap;transition:color .2s}
.tfs button[aria-selected="true"]{color:var(--ink)}
.tfs button small{font-size:12px;font-weight:600;color:var(--buy);margin-left:3px}
.tfs button:focus-visible{outline:2px solid var(--link);outline-offset:-2px}
.shot.swap{animation:settle .4s cubic-bezier(.2,.8,.2,1) both}
.chips li[hidden]{display:none}
.slide.quick .chips li{animation-delay:calc(var(--i)*.05s)}
@media (max-width:380px){ .tfs button{font-size:13px} .tfs button small{font-size:11px;margin-left:2px} }
.pic{flex:1 0 300px;min-height:300px;display:flex;margin:0 10px;border-radius:14px;overflow:hidden;background:#fff}
.shot{width:100%;height:100%;object-fit:contain;object-position:center top;cursor:zoom-in;display:block}
.levels{display:grid;grid-template-columns:1fr 1fr auto;padding:12px 18px 4px;gap:8px}
.lv span{display:block;font-size:13px;color:var(--mute)}
.lv b{display:block;font-size:clamp(17px,5.4vw,22px);font-weight:700;letter-spacing:-.01em;line-height:1.2;white-space:nowrap}
.lv.stop b{color:var(--sell)} .lv.target b{color:var(--buy)}
.lv small{font-size:12.5px;font-weight:600;color:var(--buy);margin-left:4px}
.state{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 18px 10px;font-size:14px;color:var(--mute)}
.state span{white-space:nowrap}
.st{font-weight:600;color:var(--ink);background:var(--surf);border-radius:999px;padding:3px 11px}
.st.at_zone{color:var(--amber-ink);background:var(--amber-bg)} .st.triggered{color:#00140C;background:var(--buy)} .st.invalid{color:var(--sell)}
.state .when{margin-left:auto;font-size:12.5px;white-space:nowrap}
.conf{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:10px;padding:2px 18px 10px;font-size:14px;color:var(--mute)}
.conf b{font-size:17px;color:var(--ink);font-weight:700}
.meter{position:relative;height:8px;border-radius:4px;background:var(--surf)}
.meter u{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--link);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1) .35s}
.slide.cur .meter u{width:var(--w)}
.meter em{position:absolute;top:-4px;bottom:-4px;left:70%;width:2px;border-radius:1px;background:#4A5261}
.slide.cur .conf{animation:rise .5s cubic-bezier(.2,.8,.2,1) .46s both}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 10px;margin:0;list-style:none}
.chips li{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:14px;font-size:13px;font-weight:600;white-space:nowrap}
.chips li svg{width:14px;height:14px;flex:none}
.chips .ok{background:rgba(31,201,142,.15);color:var(--ink)} .chips .ok svg{color:var(--buy)} .chips .ok small{font-size:12px;font-weight:600;color:var(--buy)}
.chips .no{box-shadow:inset 0 0 0 1px var(--line);color:var(--mute);font-weight:500}
.slide.cur .chips li{animation:pop .42s cubic-bezier(.2,.9,.3,1.2) calc(.55s + var(--i)*.06s) both}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(6px)}to{opacity:1;transform:none}}
.dots{display:flex;justify-content:center;gap:7px;padding:2px 0 12px}
.dots i{width:7px;height:7px;border-radius:50%;background:#353B46} .dots i.on{background:var(--ink)}
.none{margin:auto;padding:40px 28px;text-align:center;color:var(--mute)}
@media (min-width:800px){ body{background:#0B0D10} .app{max-width:520px;margin:0 auto;background:var(--bg);box-shadow:0 0 0 1px var(--line)} }
.view{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;display:flex}
.view[hidden]{display:none}
.view img{margin:auto;width:100%;max-width:min(100%,80dvh);height:auto;cursor:zoom-in}
.view.big img{width:230%;max-width:none;cursor:zoom-out}
.view button{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:31;background:var(--ink);color:#000;font-weight:600;border-radius:999px;padding:11px 18px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:#101216;box-shadow:0 0 0 1px var(--line);width:min(100%,560px);max-height:86dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:800px){.sheet{align-items:center}.panel{border-radius:18px;max-height:80dvh}}
.phead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 8px}
.phead h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.phead button{font-weight:600;color:var(--link);padding:11px 6px}
.pbody{overflow-y:auto;padding:0 18px 18px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.dev{background:var(--surf);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:9px;font-size:14.5px}
.dev p{margin:0} .dev ol{margin:0;padding-left:20px} .dev b{font-weight:600}
.btn{align-self:flex-start;font-weight:600;color:#000;background:var(--ink);border-radius:10px;padding:12px 18px}
.code{width:100%;height:64px;font:11.5px ui-monospace,Menlo,monospace;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;resize:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--buy);margin-right:7px}
.a{display:block;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.a:first-child{border-top:0}
.a .h{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.a .h time{font-weight:400;font-size:13px;color:var(--mute);white-space:nowrap}
.a p{margin:2px 0 0;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a.open p{display:block}
.quiet{color:var(--mute);font-size:14.5px;padding:6px 0}
.foot{font-size:12.5px;color:var(--mute);line-height:1.45}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
</style>
</head>
<body>
<div class="app" id="app">
  <button class="ask" id="ask" aria-label="Ask Claude"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 1 3.4 6.5L4 19.5l1-3.3A8 8 0 0 1 4 12z"/><path d="M9 11h6M9 14h4"/></svg></button>
  <button class="bell" id="bell" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><i></i></button>
  <div class="stage">
    <main class="home" id="home"><h1 class="title" id="week">This week</h1><div class="rows" id="rows"><div class="none wait" role="status" aria-label="Loading this week's pairs"><div class="loader"><i></i><i></i><i></i></div></div></div></main>
    <section class="detail" id="detail" aria-hidden="true">
      <div class="deck" id="deck"></div>
      <nav class="dots" id="dots" aria-hidden="true"></nav>
    </section>
  </div>
</div>

<div class="view" id="view" hidden><button id="viewClose">Close</button><img id="viewImg" alt=""></div>

<div class="chat" id="chat" role="dialog" aria-label="Ask Claude" hidden>
  <header class="chead"><h2>Ask Claude</h2><span class="cctx" id="cctx"></span><span class="grow"></span><button id="chatNew">New</button><button id="chatClose">Done</button></header>
  <div class="cbody" id="cbody" aria-live="polite"></div>
  <form class="cform" id="cform"><textarea id="cin" rows="1" placeholder="Ask about this week's trades" aria-label="Your message" enterkeyhint="send"></textarea><button id="csend" aria-label="Send" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></button></form>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-label="Notifications">
    <div class="phead"><h2>Notifications</h2><span><button id="refresh">Refresh</button>&ensp;<button id="close">Done</button></span></div>
    <div class="pbody">

const b64uToBytes = s => { s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };

async function deviceCode(sub, encPub){

  const eph = await crypto.subtle.generateKey({name:'ECDH', namedCurve:'P-256'}, true, ['deriveBits']);

  const key = await crypto.subtle.importKey('raw', await crypto.subtle.digest('SHA-256', shared), 'AES-GCM', false, ['encrypt']);

- Say what the rules say: what the setup has, what is missing, where it fails. Do not tell the trader to buy or sell, do not give position or lot sizes, and do not predict prices. The trade decision is theirs.
- When you assess a setup, end with: Rule-based analysis, not financial advice. The trade decision is yours.`;
let chatLog = []; try { const c = JSON.parse(store.get('chat', '[]')); if (Array.isArray(c)) chatLog = c.filter(m => m && (m.role === 'user' || m.role === 'assistant') && typeof m.text === 'string'); } catch (e) {}
let chatBusy = false, chatErr = '', chatKeyNote = '';
const chatKey = () => store.get('ckey', '');
function chatContext(){
  const f = feed || {};
  const setups = (f.setups || []).map(s => s.status === 'no_trade' ? { pair:s.pair, status:'no trade this week', note:s.note } : {
    pair:s.pair, side:s.side, status:s.status, weekly:s.weekly, daily:s.daily, h4:s.h4, zone:[s.zone_lo, s.zone_hi], zone_note:s.zone_note,
    planned_entry:s.entry, stop:s.stop, target:s.target, reward_to_risk:s.rr, confluence_percent:s.score,
    confluences:confOf(s).map(c => `${TFNAME[c.tf]} ${c.name}: ${c.ok ? 'have, +' + (Number(c.pts) || 0) : 'still needed'}`),
    last_price:s.price, last_price_time:s.price_at, idea_fails_at:s.invalid_level, idea_fails_note:s.invalid_note, note:s.note,
    marked_as_taken:!!takenAll()[takenKey(s.pair)] });
  return JSON.stringify({ now_india_time:new Date().toLocaleString('en-IN', { timeZone:'Asia/Kolkata', dateStyle:'full', timeStyle:'short' }), week:f.week && f.week.label, data_updated:f.updated,
    open_in_app:view ? { pair:view, timeframe:TFNAME[tfSel[view] || '4H'] } : null, setups, recent_alerts:(f.alerts || []).slice(0, 8) });
}
const b64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = no; r.readAsDataURL(blob); });
async function chartBlocks(pair){
  const s = (feed && feed.setups || []).find(x => x.pair === pair); if (!s) return [];
  const ch = chartsOf(s), out = [];
  for (const tf of TFS){ if (!ch[tf]) continue;
    try { const r = await fetch(ch[tf][0]); if (!r.ok) continue; const blob = await r.blob(); if (blob.size > 3500000) continue;
      out.push({ type:'text', text:`${pair} ${TFNAME[tf]} chart, TradingView screenshot${ch[tf][1] ? ' taken ' + ch[tf][1] : ''}${tf === '4H' ? ' (the stop, entry and target tags are the plan)' : ''}:` });
      out.push({ type:'image', source:{ type:'base64', media_type:/png$/.test(ch[tf][0]) ? 'image/png' : 'image/jpeg', data:await b64(blob) } }); } catch (e) {} }
  return out;
}
const md = t => esc(t).replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
function chatDraw(){
  const body = $('#cbody'), key = chatKey();
  $('#cform').hidden = !key; $('#chatNew').hidden = !key || !chatLog.length;
  $('#cctx').textContent = view ? `${view} ${TFNAME[tfSel[view] || '4H']}` : '';
  if (!key){
    body.innerHTML = `<div class="ckey"><h3>Add your Claude API key</h3><p>To chat here, the app needs your own key from the Claude Console. Paste it below. It is saved only on this device and is sent only to Anthropic when you ask something. Usage is billed to your API account.</p><input type="password" id="ckeyIn" placeholder="API key" aria-label="Claude API key" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" id="ckeySave">Save key on this device</button><div class="note" role="status">${esc(chatKeyNote)}</div></div>`;
    return;
  }
  let html = chatLog.map(m => `<div class="msg ${m.role === 'user' ? 'me' : 'ai'}">${md(m.text)}</div>`).join('');
  if (chatBusy && (!chatLog.length || chatLog[chatLog.length - 1].role === 'user')) html += '<div class="msg ai" id="cwait" role="status" aria-label="Claude is thinking"><div class="loader"><i></i><i></i><i></i></div></div>';
  if (chatErr) html += `<div class="msg err" role="alert">${esc(chatErr)}</div>${/key/i.test(chatErr) && chatLog.length ? '<button class="linkbtn" id="ckeyDrop" style="align-self:flex-start;padding-top:0">Remove the key from this device</button>' : ''}`;
  if (!chatLog.length && !chatBusy){
    const sug = view ? [`What is ${view} still missing?`, `How far is ${view} from its zone?`, `What would cancel the ${view} idea?`] : ['Which pair is closest to its zone?', 'What should I watch for today?', 'Explain this week\'s plan in short'];
    html += `<div class="cstart"><p>${view ? 'Ask about ' + esc(view) + ', or anything on this week\'s list.' : 'Ask about any pair on this week\'s list.'}</p>${sug.map((t, i) => `<button class="sug" style="--i:${i}" data-sug="${esc(t)}">${esc(t)}</button>`).join('')}<button class="linkbtn" id="ckeyDrop">Remove the key from this device</button></div>`;
  }
  body.innerHTML = html; body.scrollTop = body.scrollHeight;
}
function chatSave(){ store.set('chat', JSON.stringify(chatLog.slice(-40))); }
function chatOpen(){ $('#chat').hidden = false; chatErr = ''; chatDraw(); chatFit(); }
function chatFit(){ const vv = window.visualViewport, el = $('#chat'); if (!vv || el.hidden) return; el.style.setProperty('--vvh', vv.height + 'px'); el.style.top = vv.offsetTop + 'px'; const b = $('#cbody'); b.scrollTop = b.scrollHeight; }
if (window.visualViewport){ visualViewport.addEventListener('resize', chatFit); visualViewport.addEventListener('scroll', chatFit); }
async function chatSend(text){
  text = String(text || '').trim(); const key = chatKey(); if (!text || chatBusy || !key) return;
  chatErr = ''; chatBusy = true; chatLog.push({ role:'user', text }); $('#cin').value = ''; chatGrow(); chatDraw();
  try {
    const charts = view ? await chartBlocks(view) : [];
    const hist = chatLog.slice(-24); while (hist.length && hist[0].role !== 'user') hist.shift();
    const messages = hist.map(m => ({ role:m.role, content:[{ type:'text', text:m.text }] }));
    if (charts.length) messages[0].content = [{ type:'text', text:`Charts for ${view}, the trade I have open in the app:` }, ...charts, ...messages[0].content];
    const res = await fetch('https://api.anthropic.com/v1/messages', { method:'POST',
      headers:{ 'content-type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body:JSON.stringify({ model:CHAT_MODEL, max_tokens:1024, stream:true, system:CHAT_RULES + '\n\nApp data right now (JSON):\n' + chatContext(), messages }) });
    if (!res.ok){ let msg = ''; try { msg = (await res.json()).error.message || ''; } catch (e) {}
      throw Object.assign(new Error(msg || 'The request failed.'), { status:res.status }); }
    const reply = { role:'assistant', text:'' }; let started = false;
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;){ const { done, value } = await reader.read(); if (done) break; buf += dec.decode(value, { stream:true });
      let nl; while ((nl = buf.indexOf('\n')) >= 0){ const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line.startsWith('data:')) continue; let ev; try { ev = JSON.parse(line.slice(5)); } catch (e) { continue; }
        if (ev.type === 'error') throw new Error((ev.error && ev.error.message) || 'Claude stopped with an error.');
        if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta'){ reply.text += ev.delta.text;
          if (!started){ started = true; chatLog.push(reply); chatDraw(); }
          else { const last = $('#cbody').querySelector('.msg.ai:last-of-type'); if (last){ last.innerHTML = md(reply.text); const b = $('#cbody'); b.scrollTop = b.scrollHeight; } } } } }
    if (!started) throw new Error('Claude sent an empty reply. Try again.');
    chatSave();
  } catch (err) {
    if (chatLog.length && chatLog[chatLog.length - 1].role === 'assistant' && chatLog[chatLog.length - 1].text) chatSave();
    else { while (chatLog.length && chatLog[chatLog.length - 1].role !== 'user') chatLog.pop(); const u = chatLog.pop(); if (u && !$('#cin').value) $('#cin').value = u.text; }
    const m = String(err && err.message || '');
    chatErr = err.status === 401 ? (/CORS/i.test(m) ? 'This key\'s organization does not allow use from an app. Create a key in a personal Console account and save it here.' : 'The key was not accepted. Remove it and save a valid one.')
      : err.status === 429 || err.status === 529 ? 'Claude is busy or the key has hit its limit. Try again in a minute.'
      : err.status ? 'Claude could not answer: ' + (m || 'error ' + err.status) : 'Could not reach Claude. Check your connection and try again.';
    if (err.status === 401 && !/CORS/i.test(m)) chatKeyNote = '';
  }
  chatBusy = false; chatDraw(); chatGrow();
}
function chatGrow(){ const t = $('#cin'); t.style.height = 'auto'; t.style.height = Math.min(132, t.scrollHeight) + 'px'; $('#csend').disabled = chatBusy || !t.value.trim(); }
$('#cin').addEventListener('input', chatGrow);
$('#cin').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); chatSend($('#cin').value); } });
$('#cform').addEventListener('submit', e => { e.preventDefault(); chatSend($('#cin').value); });
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#ask')){ chatOpen(); return; }
  if (t.id === 'chatClose'){ $('#chat').hidden = true; return; }
  if (t.id === 'chatNew'){ if (chatBusy) return; chatLog = []; chatErr = ''; chatSave(); chatDraw(); return; }
  if (t.id === 'ckeySave'){ const v = ($('#ckeyIn').value || '').trim(); if (v.length < 20 || /\s/.test(v)){ chatKeyNote = 'That does not look like an API key.'; chatDraw(); return; } chatKeyNote = ''; store.set('ckey', v); chatDraw(); $('#cin').focus(); return; }
  if (t.id === 'ckeyDrop'){ try { localStorage.removeItem('ckey'); } catch (err) {} chatErr = ''; chatDraw(); return; }
  const sg = t.closest('[data-sug]'); if (sg){ chatSend(sg.dataset.sug); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#chat').hidden = true; });
</script>
