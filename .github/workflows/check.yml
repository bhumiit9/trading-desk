name: Hourly check

# Every hour of the entry window (9:37 AM to 9:37 PM IST, Monday to Friday):
# read prices, check them against the zones, save the result and send notifications.
on:
  schedule:
    - cron: '7 4-16 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/fetch_prices.py', '.github/workflows/check.yml']

permissions:
  contents: write

concurrency:
  group: desk-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read prices
        id: prices
        run: python3 tools/fetch_prices.py
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      - name: Check zones
        if: steps.prices.outputs.ready == 'true'
        run: python3 tools/check.py run
      - name: Save
        if: steps.prices.outputs.ready == 'true'
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          git add -A data
          NEW=$(git diff --cached --name-only --diff-filter=A -- data/outbox | tr '\n' ' ')
          echo "NEW_OUTBOX=$NEW" >> "$GITHUB_ENV"
          if ! git diff --cached --quiet; then
            git commit -q -m "Hourly check $(TZ=Asia/Kolkata date '+%d %b %H:%M') IST"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi
      - name: Send notifications
        if: env.NEW_OUTBOX != ''
        run: |
          cd tools/push && npm ci --omit=dev && cd ../..
          node tools/push/send.mjs
        env:
          PUSH_KEYS: ${{ secrets.PUSH_KEYS }}
          OUTBOX_FILES: ${{ env.NEW_OUTBOX }}
